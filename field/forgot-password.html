<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reset Password - PF Field Portal</title>
<meta name="theme-color" content="#1F6FB2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PF Field">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#006DB0;
    --accent-dark:#005A91;
    --accent-light:#EBF4FB;
    --text:#1A2233;
    --text-soft:#4A5568;
    --border:#E6E8EB;
    --bg:#ffffff;
    --card:#ffffff;
    --error:#dc2626;
    --success:#16a34a;
    --input-bg:#F7F8FA;
  }
  [data-theme="dark"]{
    --text:#E8ECF2;
    --text-soft:#7A8A9B;
    --border:#252D3D;
    --bg:#0F1117;
    --card:#1B2130;
    --error:#f87171;
    --success:#3fb950;
    --input-bg:#252D3D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .login-box{
    width:100%;max-width:380px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:36px 32px 30px;
    color:var(--text);
  }
  .brand{
    text-align:center;margin-bottom:22px;
  }
  .brand .mark{
    display:inline-flex;align-items:center;justify-content:center;
    width:56px;height:56px;border-radius:14px;
    background:var(--accent);color:#fff;
    font-weight:700;font-size:1.4rem;letter-spacing:0.5px;
    margin-bottom:12px;
  }
  .brand h1{
    font-size:1.18rem;font-weight:700;margin:0;color:var(--text);
  }
  .brand p{
    font-size:0.86rem;color:var(--text-soft);margin:4px 0 0;
  }
  label{
    display:block;font-size:0.8rem;font-weight:600;color:var(--text-soft);
    margin:14px 0 5px;
  }
  input[type=email]{
    width:100%;padding:11px 13px;
    border:1px solid var(--border);border-radius:8px;
    font-size:0.95rem;font-family:inherit;color:var(--text);
    background:var(--input-bg);transition:border-color .15s, box-shadow .15s;
  }
  input:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-light);
  }
  button{
    width:100%;margin-top:22px;padding:12px;
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    font-size:0.98rem;font-weight:600;font-family:inherit;cursor:pointer;
    transition:background .15s;
  }
  button:hover{background:var(--accent-dark);}
  button:disabled{opacity:0.6;cursor:default;}
  .msg{
    display:none;margin-top:16px;padding:10px 12px;border-radius:8px;
    font-size:0.86rem;
  }
  .msg.error{
    background:rgba(180,35,42,.08);border:1px solid rgba(180,35,42,.25);
    color:var(--error);
  }
  .msg.success{
    background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.25);
    color:var(--success);
  }
  .msg.show{display:block;}
  .foot{
    text-align:center;margin-top:20px;
    font-size:0.76rem;color:var(--text-soft);line-height:1.5;
  }
  .foot a{color:var(--accent);text-decoration:none;}
  .foot a:hover{text-decoration:underline;}
</style>
<!-- No-flash theme -->
<script>(function(){try{var t=localStorage.getItem('pf-theme');var d=t==='dark'||(t==null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');}catch(e){}}());</script>
</head>
<body>
  <form class="login-box" id="forgotForm" autocomplete="on">
    <div class="brand">
      <div class="mark">PF</div>
      <h1>Reset Password</h1>
      <p>Enter your email to receive a reset link</p>
    </div>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="username"
           required autofocus placeholder="you@pierfoundations.com">

    <button type="submit" id="submitBtn">Send reset link</button>

    <div class="msg error" id="errorBox" role="alert"></div>
    <div class="msg success" id="successBox" role="status"></div>

    <div class="foot">
      <a href="/login.html">Back to sign in</a>
    </div>
  </form>

<script>
(function () {
  var form = document.getElementById('forgotForm');
  var btn = document.getElementById('submitBtn');
  var errBox = document.getElementById('errorBox');
  var okBox = document.getElementById('successBox');

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
    okBox.classList.remove('show');
  }
  function showSuccess(msg) {
    okBox.textContent = msg;
    okBox.classList.add('show');
    errBox.classList.remove('show');
  }
  function clearMsgs() {
    errBox.textContent = '';
    okBox.textContent = '';
    errBox.classList.remove('show');
    okBox.classList.remove('show');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearMsgs();
    btn.disabled = true;
    btn.textContent = 'Sending...';

    var email = document.getElementById('email').value.trim();

    fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    })
    .then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, data: data }; });
    })
    .then(function (r) {
      // Always show the generic message — server prevents enumeration
      showSuccess((r.data && r.data.message) || 'If that email is registered, a reset link has been sent.');
      btn.disabled = true;
      btn.textContent = 'Sent';
    })
    .catch(function () {
      showError('Could not reach the server. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    });
  });
})();
</script>
</body>
</html>
