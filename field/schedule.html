<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#006DB0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pf-r5.css">
<style>
  #main { max-width:1100px; margin:0 auto; padding:16px 14px 40px; }

  /* ---- Page header + month nav ---- */
  .page-head { display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px; margin-bottom:6px; }
  .page-head h1 { font-size:1.1rem; font-weight:700; color:var(--text-0); margin:0; }
  .month-nav { display:flex; align-items:center; gap:8px; }
  .month-nav .month-label { font-size:.95rem; font-weight:600; color:var(--text-0);
    min-width:130px; text-align:center; }
  .month-nav .nav-btn { background:var(--bg-2); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:6px 12px; font-size:.82rem;
    font-family:inherit; font-weight:600; color:var(--text-1); cursor:pointer; }
  .month-nav .nav-btn:hover { background:var(--border); }
  .month-nav .nav-btn.today-btn { background:var(--accent-light); color:var(--accent);
    border-color:var(--accent); }
  .note-row { font-size:.78rem; color:var(--text-3); margin-bottom:12px; }

  /* ---- Month grid ---- */
  .cal-outer { background:var(--bg-card,#fff); border:1px solid var(--border-light);
    border-radius:var(--radius,8px); overflow:hidden; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); }

  /* Day-of-week header cells */
  .cal-dow { background:var(--bg-2); font-size:.68rem; font-weight:700;
    text-transform:uppercase; letter-spacing:.3px; color:var(--text-3);
    text-align:center; padding:7px 2px;
    border-bottom:1px solid var(--border-light); }

  /* Day cells */
  .cal-cell { min-height:72px; padding:4px 3px 3px; overflow:hidden;
    border-right:1px solid var(--border-light);
    border-bottom:1px solid var(--border-light);
    position:relative; }
  .cal-cell:nth-child(7n) { border-right:none; }
  .cal-cell.cal-outside { background:var(--bg-2); }
  .cal-cell.cal-today { background:var(--accent-light); }
  .cal-cell.cal-today .cal-num { color:var(--accent); font-weight:700; }
  /* Remove bottom border on last row cells (handled via JS data-last-row attr) */
  .cal-cell[data-last-row] { border-bottom:none; }

  .cal-num { display:block; font-size:.72rem; font-weight:600; color:var(--text-2);
    line-height:1; margin-bottom:3px; }

  /* Name pills */
  .cal-entries { display:flex; flex-direction:column; gap:2px; }
  .cal-entry { display:block; background:var(--accent-light); color:var(--accent);
    border-radius:3px; font-size:.66rem; font-weight:500;
    padding:1px 4px; line-height:1.4;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .cal-more { display:block; font-size:.6rem; color:var(--text-3);
    padding-left:2px; line-height:1.4; }

  /* Tappable cell on mobile */
  @media (hover:none) { .cal-cell.cal-has-entries { cursor:pointer; } }
  .cal-cell.cal-has-entries { cursor:pointer; }

  /* ---- Day detail panel (tap/click) ---- */
  #dayDetail { display:none; margin-top:10px;
    padding:11px 14px; background:var(--bg-card,#fff);
    border:1px solid var(--border-light);
    border-left:3px solid var(--accent);
    border-radius:var(--radius,8px); font-size:.85rem; }
  #dayDetail .det-hd { display:flex; align-items:center;
    justify-content:space-between; margin-bottom:8px; }
  #dayDetail .det-title { font-weight:700; font-size:.9rem; color:var(--text-0); }
  #dayDetail .det-close { font:inherit; font-size:.78rem; background:none; border:none;
    color:var(--text-3); cursor:pointer; padding:0 2px; }
  #dayDetail .det-close:hover { color:var(--text-1); }
  #dayDetail .det-row { padding:4px 0; border-bottom:1px solid var(--border-light);
    color:var(--text-1); }
  #dayDetail .det-row:last-child { border-bottom:none; }
  #dayDetail .det-none { color:var(--text-3); font-style:italic; }

  /* ---- Mobile: 7 cols must fit; shrink text, tighter cells ---- */
  @media (max-width:520px) {
    #main { padding:10px 6px 32px; }
    .cal-cell { min-height:54px; padding:3px 2px 2px; }
    .cal-num { font-size:.65rem; }
    .cal-entry { font-size:.58rem; padding:1px 2px; }
    .cal-more { font-size:.56rem; }
    .month-nav .nav-btn { padding:5px 8px; font-size:.76rem; }
    .month-nav .month-label { min-width:100px; }
  }
</style>
<script>(function(){try{var t=localStorage.getItem('pf-theme');var d=t==='dark'||(t==null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');}catch(e){}}());</script>
</head>
<body>

<div id="loading">Loading...</div>
<div id="authError"><p>Session expired. <a href="/login.html">Sign in again</a></p></div>

<div id="main" style="display:none">
  <div class="page-head">
    <h1>Team Schedule</h1>
    <div class="month-nav">
      <button class="nav-btn" id="prevMonthBtn">&larr;</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="nav-btn" id="nextMonthBtn">&rarr;</button>
      <button class="nav-btn today-btn" id="todayBtn">Today</button>
    </div>
  </div>
  <div class="note-row">Approved time off &mdash; job schedule not yet included.</div>

  <!-- Month grid -->
  <div class="cal-outer">
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- Day detail panel: shown when user taps/clicks a day that has entries -->
  <div id="dayDetail"></div>
</div>

<script src="/js/pf-shared.js"></script>
<script>
"use strict";
window.esc = window.esc || function(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
};

var _viewYear  = new Date().getFullYear();
var _viewMonth = new Date().getMonth(); // 0-based
var _absences  = [];

// Currently selected cell iso for detail panel
var _detailIso = null;

// ---- Date utilities ---- (unchanged from original)
var MONTHS = ['January','February','March','April','May','June',
              'July','August','September','October','November','December'];
var DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DOW_FULL  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function padZ(n) { return n < 10 ? '0'+n : String(n); }
function isoDate(y,m,d) { return y+'-'+padZ(m+1)+'-'+padZ(d); }

function daysInMonth(year, month) { // month 0-based
  return new Date(year, month+1, 0).getDate();
}

function todayIso() {
  var d = new Date();
  return d.getFullYear()+'-'+padZ(d.getMonth()+1)+'-'+padZ(d.getDate());
}

function monthRange(year, month) {
  var last = daysInMonth(year, month);
  return { from: isoDate(year, month, 1), to: isoDate(year, month, last) };
}

// ---- Build day-map: iso -> [{ name, half_day }] ----
// Consumes only name and half_day from the API response (no type/label).
function buildDayMap(absences) {
  var map = {};
  absences.forEach(function(a) {
    if (!a.start_date || !a.end_date) return;
    var s   = new Date(a.start_date + 'T12:00:00Z');
    var e   = new Date(a.end_date   + 'T12:00:00Z');
    var cur = new Date(s);
    var lim = 0;
    while (cur <= e && lim < 400) {
      var iso = cur.toISOString().slice(0,10);
      if (!map[iso]) map[iso] = [];
      map[iso].push({ name: a.name || '', half: !!a.half_day });
      cur.setUTCDate(cur.getUTCDate() + 1);
      lim++;
    }
  });
  return map;
}

// ---- Render month grid ----
function renderCalendar(year, month, absences) {
  var grid    = document.getElementById('calGrid');
  var today   = todayIso();
  var dayMap  = buildDayMap(absences);
  var numDays = daysInMonth(year, month);

  // Day of week the 1st falls on (0=Sun … 6=Sat)
  var firstDow = new Date(isoDate(year, month, 1) + 'T12:00:00Z').getUTCDay();

  var totalCells = firstDow + numDays;
  var nRows      = Math.ceil(totalCells / 7);
  var totalGrid  = nRows * 7;

  // Narrow viewport: show fewer entries per cell before "+N more"
  var narrow = window.innerWidth <= 520;
  var maxVis = narrow ? 1 : 2;

  // Clear previous grid
  while (grid.firstChild) grid.removeChild(grid.firstChild);

  // DOW header row (7 cells)
  for (var h = 0; h < 7; h++) {
    var hdr = document.createElement('div');
    hdr.className = 'cal-dow';
    hdr.textContent = DOW_SHORT[h];
    grid.appendChild(hdr);
  }

  // Day cells
  for (var i = 0; i < totalGrid; i++) {
    var dayNum   = i - firstDow + 1;
    var inMonth  = dayNum >= 1 && dayNum <= numDays;
    var isLastRow = i >= (nRows - 1) * 7;
    var col      = i % 7;

    var cell = document.createElement('div');
    cell.className = 'cal-cell' + (inMonth ? '' : ' cal-outside');
    if (isLastRow) cell.setAttribute('data-last-row', '1');

    if (inMonth) {
      var iso     = isoDate(year, month, dayNum);
      var isToday = iso === today;
      if (isToday) cell.classList.add('cal-today');

      // Day number
      var numEl = document.createElement('span');
      numEl.className = 'cal-num';
      numEl.textContent = String(dayNum);
      cell.appendChild(numEl);

      var entries = dayMap[iso] || [];
      if (entries.length > 0) {
        cell.classList.add('cal-has-entries');
        cell.setAttribute('data-iso', iso);

        var entriesWrap = document.createElement('div');
        entriesWrap.className = 'cal-entries';

        var visible = entries.slice(0, maxVis);
        var hidden  = entries.length - visible.length;

        visible.forEach(function(entry) {
          var pill = document.createElement('span');
          pill.className = 'cal-entry';
          // First name only in the cell (saves space); full details on tap
          var firstName = entry.name.split(' ')[0];
          pill.textContent = firstName + (entry.half ? ' ½' : '');
          entriesWrap.appendChild(pill);
        });

        if (hidden > 0) {
          var moreEl = document.createElement('span');
          moreEl.className = 'cal-more';
          moreEl.textContent = '+' + hidden + ' more';
          entriesWrap.appendChild(moreEl);
        }

        cell.appendChild(entriesWrap);

        // Tap / click: show detail panel below grid
        (function(cellIso, cellEntries) {
          cell.addEventListener('click', function() {
            showDetail(cellIso, cellEntries);
          });
        })(iso, entries);
      }
    }

    grid.appendChild(cell);
  }

  // Close any open detail panel when grid is re-rendered
  closeDetail();
}

// ---- Detail panel ----
function showDetail(iso, entries) {
  _detailIso = iso;
  var panel = document.getElementById('dayDetail');
  // Clear safely
  while (panel.firstChild) panel.removeChild(panel.firstChild);

  // Format date: "Monday, October 26"
  var d = new Date(iso + 'T12:00:00Z');
  var label = DOW_FULL[d.getUTCDay()] + ', '
    + MONTHS[d.getUTCMonth()] + ' '
    + d.getUTCDate();

  var hd = document.createElement('div');
  hd.className = 'det-hd';

  var titleEl = document.createElement('span');
  titleEl.className = 'det-title';
  titleEl.textContent = label;

  var closeBtn = document.createElement('button');
  closeBtn.className = 'det-close';
  closeBtn.type = 'button';
  closeBtn.textContent = 'Close';
  closeBtn.addEventListener('click', closeDetail);

  hd.appendChild(titleEl);
  hd.appendChild(closeBtn);
  panel.appendChild(hd);

  if (!entries.length) {
    var none = document.createElement('div');
    none.className = 'det-none';
    none.textContent = 'No approved time off.';
    panel.appendChild(none);
  } else {
    entries.forEach(function(entry) {
      var row = document.createElement('div');
      row.className = 'det-row';
      row.textContent = entry.name + (entry.half ? ' — half day' : '');
      panel.appendChild(row);
    });
  }

  panel.style.display = 'block';
  // Scroll panel into view on mobile
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDetail() {
  _detailIso = null;
  var panel = document.getElementById('dayDetail');
  panel.style.display = 'none';
  while (panel.firstChild) panel.removeChild(panel.firstChild);
}

// ---- Load absences for a date range (unchanged from original) ----
function loadAbsences(from, to, callback) {
  var url = '/api/schedule-absences?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to);
  fetch(url, {credentials:'same-origin'})
    .then(function(r){ return r.json(); })
    .then(function(d) { callback(d.absences || []); })
    .catch(function() { callback([]); });
}

function updateView() {
  var label = document.getElementById('monthLabel');
  if (label) label.textContent = MONTHS[_viewMonth] + ' ' + _viewYear;
  var range = monthRange(_viewYear, _viewMonth);
  loadAbsences(range.from, range.to, function(absences) {
    _absences = absences;
    renderCalendar(_viewYear, _viewMonth, absences);
  });
}

document.getElementById('prevMonthBtn').addEventListener('click', function() {
  _viewMonth--;
  if (_viewMonth < 0) { _viewMonth = 11; _viewYear--; }
  updateView();
});

document.getElementById('nextMonthBtn').addEventListener('click', function() {
  _viewMonth++;
  if (_viewMonth > 11) { _viewMonth = 0; _viewYear++; }
  updateView();
});

document.getElementById('todayBtn').addEventListener('click', function() {
  var now = new Date();
  _viewYear  = now.getFullYear();
  _viewMonth = now.getMonth();
  updateView();
});

// Re-render on resize so maxVis recomputes for narrow/wide
var _resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(function() {
    renderCalendar(_viewYear, _viewMonth, _absences);
  }, 200);
});

// ---- Boot (unchanged from original) ----
(function() {
  var loadEl = document.getElementById('loading');
  var mainEl = document.getElementById('main');
  var errEl  = document.getElementById('authError');
  var acctNm = document.getElementById('acctName');

  fetch('/api/me', {credentials:'same-origin'})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(res) {
      if (res.ok && res.d && res.d.status === 'ok') {
        if (acctNm) acctNm.textContent = res.d.name || '';
        if (loadEl) loadEl.style.display = 'none';
        if (mainEl) mainEl.style.display = 'block';
        updateView();
      } else if (res.d && res.d.status === 'must_reset') {
        window.location.href = '/reset-password.html';
      } else {
        window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname);
      }
    }).catch(function() {
      if (loadEl) loadEl.style.display = 'none';
      if (errEl)  errEl.style.display  = 'block';
    });
})();
</script>
</body>
