<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Schedule — PF Field Portal</title>
<meta name="theme-color" content="#006DB0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pf-r5.css">
<style>
  #main { max-width:1100px; margin:0 auto; padding:16px 14px 40px; }
  .page-head { display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .page-head h1 { font-size:1.1rem; font-weight:700; color:var(--text-0); margin:0; }
  .month-nav { display:flex; align-items:center; gap:10px; }
  .month-nav .month-label { font-size:.95rem; font-weight:600; color:var(--text-0);
    min-width:130px; text-align:center; }
  .month-nav .nav-btn { background:var(--bg-2); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:6px 12px; font-size:.82rem;
    font-family:inherit; font-weight:600; color:var(--text-1); cursor:pointer; }
  .month-nav .nav-btn:hover { background:var(--border); }
  .month-nav .nav-btn.today-btn { background:var(--accent-light); color:var(--accent);
    border-color:var(--accent); }
  .cal-wrap { overflow-x:auto; }
  .cal-table { width:100%; border-collapse:collapse; min-width:500px; }
  .cal-table th { font-size:.72rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.3px; color:var(--text-3); padding:6px 8px;
    border-bottom:2px solid var(--border); text-align:left; white-space:nowrap; }
  .cal-table th.day-col { text-align:center; min-width:34px; }
  .cal-table td { padding:5px 8px; border-bottom:1px solid var(--border-light);
    vertical-align:middle; font-size:.82rem; color:var(--text-1); }
  .cal-table td.day-cell { text-align:center; vertical-align:middle; padding:4px 2px; }
  .cal-table td.name-cell { white-space:nowrap; color:var(--text-1); font-size:.82rem; }
  .cal-table tr:last-child td { border-bottom:none; }
  .day-num { font-size:.72rem; color:var(--text-3); }
  .day-num.today { color:var(--accent); font-weight:700; }
  .absent-block { display:block; background:var(--accent-light); color:var(--accent);
    border:1px solid var(--accent); border-radius:4px; font-size:.7rem; font-weight:600;
    text-align:center; padding:2px 0; margin:1px 2px; }
  .absent-half { background:var(--amber-light); color:var(--amber);
    border-color:var(--amber); }
  .month-empty { text-align:center; padding:30px 0; color:var(--text-3); font-size:.875rem; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:.78rem;
    color:var(--text-2); align-items:center; }
  .legend-dot { display:inline-block; width:12px; height:12px; border-radius:2px;
    margin-right:4px; vertical-align:middle; }
  .legend-full { background:var(--accent-light); border:1px solid var(--accent); }
  .legend-half { background:var(--amber-light); border:1px solid var(--amber); }
  .note-row { font-size:.78rem; color:var(--text-3); margin-bottom:10px; }
</style>
<script>(function(){try{var t=localStorage.getItem('pf-theme');var d=t==='dark'||(t==null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.setAttribute('data-theme','dark');}catch(e){}}());</script>
</head>
<body>

<div id="topbar">
  <a href="/" class="tb-brand" aria-label="PF Field Portal">
    <div class="tb-mark">PF</div>
    <span class="tb-title">Field Portal</span>
  </a>
  <details class="acct-menu" id="acctMenu">
    <summary>
      <span class="acct-btn">
        <span class="acct-name" id="acctName"></span>
        <svg class="acct-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </span>
    </summary>
    <div class="acct-dropdown">
      <button type="button" class="acct-item" onclick="window.pfToggleTheme()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
        <span id="acctThemeLabel">Dark mode</span>
      </button>
      <div class="acct-divider"></div>
      <a class="acct-item" href="/api/logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Sign Out
      </a>
    </div>
  </details>
</div>

<nav id="pfNav" aria-label="Main navigation">
  <a href="/" class="pf-nav-item" data-paths="/, /index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    <span>Home</span>
  </a>
  <a href="/daily-report.html" class="pf-nav-item" data-paths="/daily-report.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
    <span>Daily Report</span>
  </a>
  <a href="/time-off.html" class="pf-nav-item" data-paths="/time-off.html, /time-off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><path d="M8 14l2 2 4-4"></path></svg>
    <span>Time Off</span>
  </a>
  <a href="/schedule.html" class="pf-nav-item" data-paths="/schedule.html, /schedule">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
    <span>Schedule</span>
  </a>
  <a href="/past-reports.html" class="pf-nav-item" data-paths="/past-reports.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    <span>Past Reports</span>
  </a>
</nav>

<div id="loading">Loading...</div>
<div id="authError"><p>Session expired. <a href="/login.html">Sign in again</a></p></div>

<div id="main" style="display:none">
  <div class="page-head">
    <h1>Team Schedule</h1>
    <div class="month-nav">
      <button class="nav-btn" id="prevMonthBtn">&larr;</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="nav-btn" id="nextMonthBtn">&rarr;</button>
      <button class="nav-btn today-btn" id="todayBtn">Today</button>
    </div>
  </div>
  <div class="note-row">Showing approved time off. Job schedule coming soon.</div>
  <div class="legend">
    <span><span class="legend-dot legend-full"></span>Full day off</span>
    <span><span class="legend-dot legend-half"></span>Half day off</span>
  </div>
  <div class="cal-wrap" id="calWrap">
    <div class="month-empty">Loading...</div>
  </div>
</div>

<script src="/js/pf-shared.js"></script>
<script>
"use strict";
window.esc = window.esc || function(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
};

var _viewYear  = new Date().getFullYear();
var _viewMonth = new Date().getMonth(); // 0-based
var _absences  = [];

// ---- Date utilities ----
var MONTHS = ['January','February','March','April','May','June',
              'July','August','September','October','November','December'];
var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function padZ(n) { return n < 10 ? '0'+n : String(n); }
function isoDate(y,m,d) { return y+'-'+padZ(m+1)+'-'+padZ(d); }

function daysInMonth(year, month) { // month 0-based
  return new Date(year, month+1, 0).getDate();
}

function todayIso() {
  var d = new Date();
  return d.getFullYear()+'-'+padZ(d.getMonth()+1)+'-'+padZ(d.getDate());
}

// First and last day of the current view month
function monthRange(year, month) {
  var last = daysInMonth(year, month);
  return { from: isoDate(year, month, 1), to: isoDate(year, month, last) };
}

// ---- Load absences for a date range ----
function loadAbsences(from, to, callback) {
  var url = '/api/schedule-absences?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to);
  fetch(url, {credentials:'same-origin'})
    .then(function(r){ return r.json(); })
    .then(function(d) { callback(d.absences || []); })
    .catch(function() { callback([]); });
}

// ---- Render calendar grid ----
function renderCalendar(year, month, absences) {
  var el = document.getElementById('calWrap');
  var today = todayIso();
  var numDays = daysInMonth(year, month);

  // Gather unique employees who have absences this month
  var empMap = {}; // uid -> name
  absences.forEach(function(a) {
    if (!empMap[a.uid]) empMap[a.uid] = a.name || a.uid;
  });
  var empKeys = Object.keys(empMap);

  // Build a day->uid set map: which uids are absent on each date
  var dayAbsMap = {}; // iso -> { uid -> half_day }
  absences.forEach(function(a) {
    var s = new Date(a.start_date + 'T12:00:00Z');
    var e = new Date(a.end_date   + 'T12:00:00Z');
    var cur = new Date(s);
    while (cur <= e) {
      var iso = cur.toISOString().slice(0,10);
      if (!dayAbsMap[iso]) dayAbsMap[iso] = {};
      dayAbsMap[iso][a.uid] = a.half_day ? 1 : 0;
      cur.setUTCDate(cur.getUTCDate() + 1);
    }
  });

  // Day header row: day number + day name
  var days = [];
  for (var d = 1; d <= numDays; d++) {
    var iso = isoDate(year, month, d);
    var dow = new Date(iso + 'T12:00:00Z').getUTCDay();
    days.push({ d:d, iso:iso, name:DAYS[dow] });
  }

  var headCells = days.map(function(day) {
    var isToday = day.iso === today;
    return '<th class="day-col">' +
      '<div class="day-num'+(isToday?' today':'')+'">'+day.d+'</div>' +
      '<div style="font-size:.65rem;color:var(--text-3)">'+day.name+'</div>' +
      '</th>';
  }).join('');

  var html = '<table class="cal-table"><thead><tr>' +
    '<th style="min-width:110px;">Employee</th>' + headCells +
    '</tr></thead><tbody>';

  if (!empKeys.length) {
    html += '<tr><td colspan="'+(numDays+1)+'" class="month-empty">No approved absences this month.</td></tr>';
  } else {
    empKeys.forEach(function(uid) {
      var row = '<tr><td class="name-cell">'+window.esc(empMap[uid])+'</td>';
      days.forEach(function(day) {
        var cell = '';
        if (dayAbsMap[day.iso] && day.iso >= today.slice(0,7)+'-01' /* always render */) {
          if (typeof dayAbsMap[day.iso][uid] !== 'undefined') {
            var isHalf = dayAbsMap[day.iso][uid] === 1;
            cell = '<span class="absent-block'+(isHalf?' absent-half':'')+'">'+(isHalf?'½':'OFF')+'</span>';
          }
        } else if (dayAbsMap[day.iso] && typeof dayAbsMap[day.iso][uid] !== 'undefined') {
          var isHalf = dayAbsMap[day.iso][uid] === 1;
          cell = '<span class="absent-block'+(isHalf?' absent-half':'')+'">'+(isHalf?'½':'OFF')+'</span>';
        }
        row += '<td class="day-cell">'+cell+'</td>';
      });
      row += '</tr>';
      html += row;
    });
  }

  html += '</tbody></table>';
  el.innerHTML = html;
}

function updateView() {
  var label = document.getElementById('monthLabel');
  if (label) label.textContent = MONTHS[_viewMonth] + ' ' + _viewYear;
  var range = monthRange(_viewYear, _viewMonth);
  loadAbsences(range.from, range.to, function(absences) {
    _absences = absences;
    renderCalendar(_viewYear, _viewMonth, absences);
  });
}

document.getElementById('prevMonthBtn').addEventListener('click', function() {
  _viewMonth--;
  if (_viewMonth < 0) { _viewMonth = 11; _viewYear--; }
  updateView();
});

document.getElementById('nextMonthBtn').addEventListener('click', function() {
  _viewMonth++;
  if (_viewMonth > 11) { _viewMonth = 0; _viewYear++; }
  updateView();
});

document.getElementById('todayBtn').addEventListener('click', function() {
  var now = new Date();
  _viewYear  = now.getFullYear();
  _viewMonth = now.getMonth();
  updateView();
});

// ---- Boot ----
(function() {
  var loadEl = document.getElementById('loading');
  var mainEl = document.getElementById('main');
  var errEl  = document.getElementById('authError');
  var acctNm = document.getElementById('acctName');

  fetch('/api/me', {credentials:'same-origin'})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(res) {
      if (res.ok && res.d && res.d.status === 'ok') {
        if (acctNm) acctNm.textContent = res.d.name || '';
        if (loadEl) loadEl.style.display = 'none';
        if (mainEl) mainEl.style.display = 'block';
        updateView();
      } else if (res.d && res.d.status === 'must_reset') {
        window.location.href = '/reset-password.html';
      } else {
        window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname);
      }
    }).catch(function() {
      if (loadEl) loadEl.style.display = 'none';
      if (errEl)  errEl.style.display  = 'block';
    });
})();
</script>
</body>
</html>
