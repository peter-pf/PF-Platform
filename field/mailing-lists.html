<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mailing Lists — PF Field Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pf-r5.css">
  <style>
    .ml-page-title { font-size:1.2rem; font-weight:700; margin-bottom:4px; }
    .ml-page-subtitle { font-size:.85rem; color:var(--text-3); margin-bottom:22px; }
    .ml-section { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:20px; }
    .ml-section-head { padding:14px 16px 10px; border-bottom:1px solid var(--border); }
    .ml-section-title { font-size:.9rem; font-weight:700; }
    .ml-section-desc { font-size:.78rem; color:var(--text-3); margin-top:2px; }
    .ml-list { list-style:none; margin:0; padding:0; }
    .ml-list-empty { padding:12px 16px; font-size:.82rem; color:var(--text-3); }
    .ml-item { display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid var(--border); }
    .ml-item:first-child { border-top:none; }
    .ml-email { flex:1; font-size:.85rem; word-break:break-all; }
    .ml-badge { font-size:.7rem; font-weight:600; padding:2px 7px; border-radius:10px; background:var(--bg-2); color:var(--text-3); flex-shrink:0; }
    .ml-rm { font-size:.78rem; padding:4px 10px; }
    .ml-add-row { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); flex-wrap:wrap; }
    .ml-add-row input { flex:1; min-width:180px; padding:7px 10px; font-size:.85rem; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2); color:var(--text-1); font-family:inherit; }
    .ml-add-row input:focus { outline:none; border-color:var(--accent); }
    .ml-msg { padding:8px 16px; font-size:.8rem; border-top:1px solid var(--border); }
    .ml-msg.ok  { color:var(--green); }
    .ml-msg.err { color:var(--red); }

    /* Btn classes (same as time-off.html) */
    .btn { display:inline-flex; align-items:center; justify-content:center;
           gap:6px; padding:8px 16px; border-radius:var(--radius-sm);
           font-size:.85rem; font-weight:600; font-family:inherit;
           cursor:pointer; border:1px solid transparent;
           transition:background .12s,border-color .12s,color .12s; white-space:nowrap; }
    .btn:disabled { opacity:.55; cursor:default; }
    .btn-primary   { background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn-primary:hover:not(:disabled) { background:var(--accent-dark); border-color:var(--accent-dark); }
    .btn-secondary { background:var(--bg-2); color:var(--text-1); border-color:var(--border); }
    .btn-secondary:hover:not(:disabled) { background:var(--border); }
    .btn-danger    { background:var(--red-light); color:var(--red); border-color:var(--red); }
    .btn-danger:hover:not(:disabled) { background:var(--red); color:#fff; }
    .btn-sm        { padding:5px 12px; font-size:.8rem; }
  </style>
</head>
<body>

<div class="pf-topbar">
  <a href="/" class="tb-brand" aria-label="PF Field Portal">
    <div class="tb-mark">PF</div>
    <span class="tb-title">Field Portal</span>
  </a>
  <details class="acct-menu" id="acctMenu">
    <summary>
      <span class="acct-btn">
        <span class="acct-name" id="acctName"></span>
        <svg class="acct-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </span>
    </summary>
    <div class="acct-dropdown">
      <button type="button" class="acct-item" onclick="window.pfToggleTheme()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
        <span id="acctThemeLabel">Dark mode</span>
      </button>
      <div class="acct-divider"></div>
      <a class="acct-item" href="/api/logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Sign Out
      </a>
    </div>
  </details>
</div>

  </a>

    <span>Schedule</span>
  </a>
  <a href="/time-off.html" class="pf-nav-item" data-paths="/time-off.html, /time-off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><path d="M8 14l2 2 4-4"></path></svg>
    <span>Time Off</span>

  <!-- Owner-only: shown by JS after /api/me confirms owner email -->
  <a href="/mailing-lists.html" class="pf-nav-item ml-nav-item" data-paths="/mailing-lists.html, /mailing-lists" style="display:none" id="mlNavItem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
    <span>Mailing Lists</span>
  </a>
</nav>

<div id="loading">Loading...</div>
<div id="authError"><p>Session expired. <a href="/login.html">Sign in again</a></p></div>

<div id="main">
<div class="pf-col">

  <div class="ml-page-title">Mailing Lists</div>
  <div class="ml-page-subtitle">Manage who receives emails when each form is submitted. Owner access only.</div>

  <div id="mlContent">
    <!-- Lists are rendered here by JS -->
  </div>

</div><!-- .pf-col -->
</div><!-- #main -->

<script src="/js/pf-shared.js"></script>
<script>
(function(){
  var OWNER_EMAILS = ['breinking@pierfoundations.com','jreinking@pierfoundations.com','dfranke@pierfoundations.com'];
  var LIST_LABELS = {
    daily_report:         'Daily Report',
    site_readiness:       'Site Readiness',
    toolbox_talk:         'Safety Analysis',
    time_off:             'Time Off Request',
    equipment_inspection: 'Equipment Inspection',
  };
  var LIST_KEYS = ['daily_report','site_readiness','toolbox_talk','time_off','equipment_inspection'];
  var AGENT_EMAIL = 'pfpeter@agentmail.to';

  var loadEl  = document.getElementById('loading');
  var mainEl  = document.getElementById('main');
  var errEl   = document.getElementById('authError');
  var acctNm  = document.getElementById('acctName');
  var mlNavItem = document.getElementById('mlNavItem');

  function E(s){ return window.esc ? window.esc(s) : String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---- Auth + owner check ---------------------------------------------------
  fetch('/api/me', {credentials:'same-origin'})
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(r){
      if (!r.ok || !r.d || r.d.status !== 'ok') {
        if (r.d && r.d.status === 'must_reset') { window.location.href = '/reset-password.html'; return; }
        window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname);
        return;
      }
      if (acctNm) acctNm.textContent = r.d.name || '';
      // Show nav item for all owner pages
      var email = (r.d.email || '').toLowerCase();
      if (OWNER_EMAILS.indexOf(email) >= 0 && mlNavItem) mlNavItem.style.display = '';

      // Owner gate (client-side check for redirect; server enforces independently)
      if (OWNER_EMAILS.indexOf(email) < 0) {
        // Non-owner: redirect to denied page
        window.location.href = '/denied.html';
        return;
      }

      if (loadEl) loadEl.style.display = 'none';
      if (mainEl) mainEl.style.display = 'block';
      loadLists();
    })
    .catch(function(){
      if (loadEl) loadEl.style.display = 'none';
      if (errEl) errEl.style.display = 'block';
    });

  // ---- Load all lists -------------------------------------------------------
  var lists = {};
  function loadLists(){
    var content = document.getElementById('mlContent');
    if (content) content.innerHTML = '<div style="padding:16px;font-size:.85rem;color:var(--text-3)">Loading...</div>';
    fetch('/api/mailing-lists', {credentials:'same-origin'})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(r){
        if (!r.ok || !r.d || !r.d.ok) {
          var msg = (r.d && r.d.error) || 'Failed to load mailing lists.';
          if (content) content.innerHTML = '<div style="padding:16px;color:var(--red)">' + E(msg) + '</div>';
          return;
        }
        lists = r.d.lists || {};
        renderLists();
      })
      .catch(function(){
        if (content) content.innerHTML = '<div style="padding:16px;color:var(--red)">Network error loading lists.</div>';
      });
  }

  // ---- Render all lists -----------------------------------------------------
  function renderLists(){
    var content = document.getElementById('mlContent');
    if (!content) return;
    content.innerHTML = LIST_KEYS.map(function(key){
      return renderSection(key, lists[key] || []);
    }).join('');
    // Wire up remove buttons
    content.querySelectorAll('[data-rm-key]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = btn.getAttribute('data-rm-key');
        var e = btn.getAttribute('data-rm-email');
        removeEmail(k, e, btn);
      });
    });
    // Wire up add forms
    LIST_KEYS.forEach(function(key){
      var addBtn = document.getElementById('mlAdd_' + key);
      if (addBtn) addBtn.addEventListener('click', function(){ addEmail(key); });
      var inp = document.getElementById('mlInput_' + key);
      if (inp) inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') addEmail(key); });
    });
  }

  function renderSection(key, rows){
    var label = LIST_LABELS[key] || key;
    var itemsHtml = rows.length ? rows.map(function(row){
      var isAgent = row.email === AGENT_EMAIL;
      var rmBtn = '<button class="btn btn-danger btn-sm ml-rm" data-rm-key="' + E(key) + '" data-rm-email="' + E(row.email) + '" aria-label="Remove ' + E(row.email) + '">Remove</button>';
      return '<li class="ml-item"><span class="ml-email">' + E(row.email) + (isAgent ? ' <span class="ml-badge">test</span>' : '') + '</span>' + rmBtn + '</li>';
    }).join('') : '<li class="ml-list-empty">No recipients.</li>';

    return '<div class="ml-section">' +
      '<div class="ml-section-head">' +
        '<div class="ml-section-title">' + E(label) + '</div>' +
        '<div class="ml-section-desc">Form key: <code>' + E(key) + '</code></div>' +
      '</div>' +
      '<ul class="ml-list">' + itemsHtml + '</ul>' +
      '<div class="ml-add-row">' +
        '<input type="email" id="mlInput_' + E(key) + '" placeholder="new@pierfoundations.com" autocomplete="off" aria-label="New email for ' + E(label) + '">' +
        '<button class="btn btn-primary btn-sm" id="mlAdd_' + E(key) + '">Add</button>' +
      '</div>' +
      '<div id="mlMsg_' + E(key) + '" class="ml-msg" style="display:none"></div>' +
    '</div>';
  }

  // ---- Add email ------------------------------------------------------------
  function addEmail(key){
    var inp = document.getElementById('mlInput_' + key);
    var email = inp ? inp.value.trim().toLowerCase() : '';
    if (!email) { showMsg(key, 'Enter an email address.', false); return; }
    if (email === AGENT_EMAIL) {
      showMsg(key, 'pfpeter@agentmail.to cannot be re-added via this UI.', false); return;
    }
    showMsg(key, 'Adding...', null);
    fetch('/api/mailing-lists', {
      method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({listKey: key, email: email}),
    })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(r){
      if (r.ok && r.d && r.d.ok) {
        if (inp) inp.value = '';
        showMsg(key, 'Added ' + email, true);
        reloadSection(key, r.d);
      } else {
        showMsg(key, (r.d && r.d.error) || 'Failed to add.', false);
      }
    })
    .catch(function(){ showMsg(key, 'Network error.', false); });
  }

  // ---- Remove email ---------------------------------------------------------
  function removeEmail(key, email, btn){
    if (btn) btn.disabled = true;
    fetch('/api/mailing-lists', {
      method: 'DELETE', credentials: 'same-origin',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({listKey: key, email: email}),
    })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
    .then(function(r){
      if (r.ok && r.d && r.d.ok) {
        // Remove the item from local state and re-render
        lists[key] = (lists[key] || []).filter(function(row){ return row.email !== email; });
        renderLists();
        showMsg(key, 'Removed ' + email, true);
      } else {
        if (btn) btn.disabled = false;
        showMsg(key, (r.d && r.d.error) || 'Failed to remove.', false);
      }
    })
    .catch(function(){
      if (btn) btn.disabled = false;
      showMsg(key, 'Network error.', false);
    });
  }

  // ---- After add: update local state without full reload --------------------
  function reloadSection(key, responseData){
    // Add the email to local lists[] and re-render
    if (!lists[key]) lists[key] = [];
    var em = responseData.email;
    if (em && !lists[key].some(function(r){ return r.email === em; })) {
      lists[key].push({ email: em, display_name: null, added_by: 'me', added_at: new Date().toISOString() });
    }
    renderLists();
  }

  // ---- Show per-list message ------------------------------------------------
  function showMsg(key, text, ok){
    var el = document.getElementById('mlMsg_' + key);
    if (!el) return;
    el.className = 'ml-msg ' + (ok === true ? 'ok' : ok === false ? 'err' : '');
    el.textContent = text;
    el.style.display = text ? 'block' : 'none';
    if (ok !== null) setTimeout(function(){ el.style.display = 'none'; }, 4000);
  }
})();
</script>
</body>
</html>
