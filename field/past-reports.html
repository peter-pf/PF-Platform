<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PF Past Reports</title>
<meta name="theme-color" content="#006DB0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PF Field">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#006DB0;--accent-dark:#005A91;--accent-light:#E0F0FF;
    --surface:#F8FAFC;--surface-2:#FFFFFF;--surface-3:#F3F5F8;
    --border:#D8E2EA;
    --text:#0B1722;--text-2:#4A5568;--text-3:#8A9AAB;
    --amber:#B45309;--green:#16A34A;--red:#B91C1C;
    --topbar-bg:#FFFFFF;--topbar-border:#D8E2EA;
    --topbar-title:#0B1722;--topbar-muted:#8A9AAB;
    --link:#006DB0;
  }
  [data-theme="dark"]{
    --surface:#131820;--surface-2:#1b212c;--surface-3:#222830;
    --border:#2a2f3a;
    --text:#e2e8f0;--text-2:#aab1c0;--text-3:#8a93a6;
    --amber:#d29922;--green:#3fb950;--red:#e5534b;
    --topbar-bg:#1b212c;--topbar-border:#2a2f3a;
    --topbar-title:#e2e8f0;--topbar-muted:#8a93a6;
    --link:#5bc8ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.5;color:var(--text);background:var(--surface);}
  a{color:var(--link);text-decoration:none;}
  a:hover{text-decoration:underline;}
  input,select,button{font-family:inherit;font-size:inherit;}
  input,select{background:var(--surface-3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:7px 10px;width:100%;}
  [data-theme="dark"] input,[data-theme="dark"] select{background:var(--surface-2);}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,109,176,.25);}

  /* ---- top bar ---- */
  #topbar{
    position:sticky;top:0;z-index:100;
    background:var(--topbar-bg);border-bottom:1px solid var(--topbar-border);
    box-shadow:0 1px 4px rgba(0,0,0,.06);
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;gap:10px;
  }
  [data-theme="dark"] #topbar{box-shadow:none;}
  #topbar .left{display:flex;align-items:center;gap:8px;}
  #topbar .tb-back{display:inline-flex;align-items:center;font-size:16px;font-weight:500;color:var(--accent);text-decoration:none;min-height:44px;padding:0 6px 0 2px;}
  #topbar .tb-back:hover{color:var(--accent-dark);text-decoration:none;}
  #topbar .tb-divider{color:var(--topbar-border);font-size:14px;user-select:none;}
  #topbar .tb-page-title{font-weight:700;font-size:15px;color:var(--topbar-title);}
  #topbar .right{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--topbar-muted);}
  #topbar .right #userLabel{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #topbar .right a{color:var(--topbar-muted);padding:6px 8px;}
  #topbar .right a:hover{color:var(--topbar-title);}
  .tb-theme{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:none;background:none;cursor:pointer;color:var(--topbar-muted);border-radius:8px;transition:background .15s,color .15s;flex:0 0 auto;}
  .tb-theme:hover{background:var(--surface-3);color:var(--topbar-title);}

  /* ---- layout ---- */
  #main{padding:14px;padding-bottom:max(24px,env(safe-area-inset-bottom));max-width:720px;margin:0 auto;}
  #loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--text-3);font-size:14px;}
  #authError{display:none;padding:32px 16px;text-align:center;color:var(--text-3);}

  /* ---- filter bar ---- */
  #filterBar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;margin-bottom:12px;
  }
  #filterBar input,#filterBar select{background:var(--surface-3);}
  [data-theme="dark"] #filterBar input,[data-theme="dark"] #filterBar select{background:var(--surface-2);}
  #filterBar input#filterText{flex:1 1 160px;min-width:120px;}
  #filterBar select#filterType{flex:0 1 160px;min-width:120px;}
  #filterBar input#filterFrom,#filterBar input#filterTo{flex:0 1 130px;min-width:110px;}
  #filterBar label{font-size:12px;color:var(--text-3);white-space:nowrap;}
  #filterCount{font-size:12px;color:var(--text-3);padding-top:2px;}

  /* ---- report list ---- */
  .pr-item{
    border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;margin-bottom:8px;
    display:flex;flex-direction:column;gap:4px;
  }
  .pr-item:hover{border-color:var(--accent);}
  .pr-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .pr-date{font-weight:700;font-size:14px;}
  .pr-project{font-size:14px;color:var(--text-2);}
  .pr-badge{
    font-size:11px;padding:2px 9px;border-radius:10px;
    background:var(--surface-3);color:var(--text-3);
    font-weight:600;white-space:nowrap;flex:0 0 auto;
  }
  .pr-badge.daily{background:rgba(0,109,176,.14);color:var(--accent-dark);}
  .pr-badge.sr{background:rgba(63,185,80,.15);color:var(--green);}
  .pr-badge.status-ready{background:rgba(63,185,80,.15);color:var(--green);}
  .pr-badge.status-not-ready{background:rgba(210,153,34,.15);color:var(--amber);}
  .pr-badge.status-sent{background:rgba(0,109,176,.14);color:var(--accent-dark);}
  .pr-badge.status-draft{background:var(--surface-3);color:var(--text-3);}
  [data-theme="dark"] .pr-badge.daily{color:#5bc8ff;}
  [data-theme="dark"] .pr-badge.status-sent{color:#5bc8ff;}
  .pr-pdf-link{font-size:12px;}
  .pr-empty{color:var(--text-3);font-size:14px;padding:24px 0;text-align:center;}
  .pr-err{color:var(--red);font-size:13px;padding:12px 0;}

  /* ---- nav (phone: tab bar  |  desktop ≥900px: left sidebar) ---- */
  :root{--nav-h:58px;--sidebar-w:180px;--topbar-h:52px;}
  #pfNav{position:fixed;bottom:0;left:0;right:0;z-index:80;display:flex;align-items:stretch;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom);background:var(--topbar-bg);border-top:1px solid var(--topbar-border);box-shadow:0 -1px 6px rgba(0,0,0,.06);}
  [data-theme="dark"] #pfNav{box-shadow:none;}
  .pf-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--text-3);font-size:9px;font-weight:600;letter-spacing:.35px;text-transform:uppercase;padding:5px 2px;transition:color .12s;min-height:44px;-webkit-tap-highlight-color:transparent;}
  .pf-nav-item svg{width:22px;height:22px;flex:0 0 auto;transition:transform .1s;}
  .pf-nav-item:hover{color:var(--accent);text-decoration:none;}
  .pf-nav-item[aria-current="page"]{color:var(--accent);}
  [data-theme="dark"] .pf-nav-item[aria-current="page"]{color:#5bc8ff;}
  .pf-nav-item[aria-current="page"] svg{transform:scale(1.1);}
  body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));}
  @media(min-width:900px){
    body{padding-bottom:0;}
    #pfNav{position:fixed;top:var(--topbar-h);left:0;right:auto;bottom:0;width:var(--sidebar-w);height:auto;flex-direction:column;align-items:stretch;border-top:none;border-right:1px solid var(--border);box-shadow:none;padding:12px 0;overflow-y:auto;}
    .pf-nav-item{flex:none;flex-direction:row;gap:10px;padding:11px 16px;font-size:13px;letter-spacing:0;text-transform:none;justify-content:flex-start;}
    .pf-nav-item[aria-current="page"]{background:var(--accent-light);color:var(--accent-dark);}
    [data-theme="dark"] .pf-nav-item[aria-current="page"]{background:rgba(0,109,176,.18);color:#a8d4f5;}
    #loading,#authError,#main{margin-left:var(--sidebar-w);}
    #main{max-width:1100px;margin-right:0;}
  }
  /* topbar brand */
  #topbar .tb-brand{display:flex;align-items:center;gap:8px;text-decoration:none;flex:1 1 auto;}
  #topbar .tb-brand:hover{text-decoration:none;}
  #topbar .tb-mark{width:30px;height:30px;border-radius:7px;flex:0 0 auto;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.3px;color:#fff;}
  #topbar .tb-page-title{font-weight:700;font-size:15px;color:var(--topbar-title);}
  #topbar .right{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--topbar-muted);}
  #topbar .right #userLabel{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #topbar .right a{color:var(--topbar-muted);font-size:13px;padding:6px 8px;}
  #topbar .right a:hover{color:var(--topbar-title);text-decoration:none;}
</style>
<!-- No-flash theme: reads stored pref first, then prefers-color-scheme -->
<script>
(function(){try{var t=localStorage.getItem('pf-theme');var dark=t==='dark'||(t==null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);if(dark)document.documentElement.setAttribute('data-theme','dark');}catch(e){}}());
</script>
</head>
<body>

<div id="topbar">
  <a href="/" class="tb-brand" aria-label="PF Field Portal">
    <div class="tb-mark">PF</div>
    <span class="tb-page-title">Past Reports</span>
  </a>
  <div class="right">
    <span id="userLabel"></span>
    <button type="button" class="tb-theme" id="themeToggle" aria-label="Switch to dark mode"></button>
    <a href="/api/logout">Sign out</a>
  </div>
</div>

<nav id="pfNav" aria-label="Main navigation">
  <a href="/" class="pf-nav-item" data-nav="home">
    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h4a1 1 0 001-1v-3h2v3a1 1 0 001 1h4a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
    <span>Home</span>
  </a>
  <a href="/daily-report.html" class="pf-nav-item" data-nav="daily">
    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"/><path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z"/></svg>
    <span>Daily Report</span>
  </a>
  <a href="/site-readiness.html" class="pf-nav-item" data-nav="sr">
    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
    <span>Site Readiness</span>
  </a>
  <a href="/past-reports.html" class="pf-nav-item" data-nav="pr">
    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
    <span>Past Reports</span>
  </a>
</nav>

<div id="loading">Loading...</div>
<div id="authError">
  <p>Session expired. <a href="/login.html">Sign in again</a></p>
</div>

<div id="main" style="display:none">
  <div id="filterBar">
    <input type="text" id="filterText" placeholder="Search project or type..." autocomplete="off" aria-label="Search">
    <select id="filterType" aria-label="Form type">
      <option value="">All types</option>
      <option value="daily-report">Daily Report</option>
      <option value="site-readiness">Site Readiness</option>
    </select>
    <label>From <input type="date" id="filterFrom" aria-label="From date"></label>
    <label>To <input type="date" id="filterTo" aria-label="To date"></label>
    <span id="filterCount"></span>
  </div>
  <div id="reportList"></div>
</div>

<script>
"use strict";
/* ---- Theme toggle ---- */
var PF_SUN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
var PF_MOON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
function pfUpdateThemeBtn(){
  var btn=document.getElementById('themeToggle');if(!btn)return;
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  btn.innerHTML=dark?PF_SUN:PF_MOON;
  btn.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');
}
function pfToggleTheme(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  try{localStorage.setItem('pf-theme',dark?'light':'dark');}catch(e){}
  pfUpdateThemeBtn();
}
document.addEventListener('DOMContentLoaded',function(){
  pfUpdateThemeBtn();
  var btn=document.getElementById('themeToggle');
  if(btn)btn.addEventListener('click',pfToggleTheme);
  var path=window.location.pathname;
  var navMap={'home':['/','/index.html'],'daily':['/daily-report.html'],'sr':['/site-readiness.html'],'pr':['/past-reports.html']};
  document.querySelectorAll('.pf-nav-item[data-nav]').forEach(function(a){var key=a.getAttribute('data-nav');var paths=navMap[key]||[];if(paths.indexOf(path)>=0)a.setAttribute('aria-current','page');});
});
/* ---- XSS escaper ---- */
window.esc = (function(){
  var m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return function(s){return s==null?'':String(s).replace(/[&<>"']/g,function(c){return m[c];});};
})();
window.pfFmtDate = function(s){
  if(!s)return'';
  var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m)return String(s);
  return m[2]+'/'+m[3]+'/'+m[1];
};

(function(){
  var loadEl=document.getElementById('loading');
  var mainEl=document.getElementById('main');
  var errEl=document.getElementById('authError');
  var userLbl=document.getElementById('userLabel');

  fetch('/api/me',{credentials:'same-origin'})
    .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
    .then(function(r){
      if(r.ok&&r.d&&r.d.status==='ok'){
        if(userLbl)userLbl.textContent=r.d.name||r.d.role||'';
        if(loadEl)loadEl.style.display='none';
        if(mainEl)mainEl.style.display='block';
        loadReports();
      } else if(r.d&&r.d.status==='must_reset'){
        window.location.href='/reset-password.html';
      } else {
        window.location.href='/login.html?next='+encodeURIComponent(window.location.pathname);
      }
    })
    .catch(function(){
      if(loadEl)loadEl.style.display='none';
      if(errEl)errEl.style.display='block';
    });
})();

var ALL_REPORTS = [];
var E = window.esc;

function loadReports(){
  var listEl=document.getElementById('reportList');
  if(listEl)listEl.innerHTML='<div class="pr-empty">Loading reports...</div>';
  fetch('/api/past-reports',{credentials:'same-origin'})
    .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
    .then(function(r){
      if(!r.ok||!r.d||!r.d.ok){
        if(listEl)listEl.innerHTML='<div class="pr-err">Could not load reports. '+(r.d&&r.d.message?E(r.d.message):'')+'</div>';
        return;
      }
      ALL_REPORTS=(Array.isArray(r.d.reports)?r.d.reports:[]);
      wireFilters();
      renderList();
    })
    .catch(function(){
      if(listEl)listEl.innerHTML='<div class="pr-err">Network error loading reports.</div>';
    });
}

function wireFilters(){
  ['filterText','filterType','filterFrom','filterTo'].forEach(function(id){
    var el=document.getElementById(id);
    if(el&&!el.dataset.wired){el.dataset.wired='1';el.addEventListener('input',renderList);el.addEventListener('change',renderList);}
  });
}

function renderList(){
  var textQ=(document.getElementById('filterText')||{}).value||'';
  var typeQ=(document.getElementById('filterType')||{}).value||'';
  var fromQ=(document.getElementById('filterFrom')||{}).value||'';
  var toQ=(document.getElementById('filterTo')||{}).value||'';
  var q=textQ.toLowerCase().trim();

  var filtered=ALL_REPORTS.filter(function(r){
    if(typeQ&&r.type!==typeQ)return false;
    if(q){
      var hay=(String(r.projectName||'')+' '+String(r.projectId||'')+' '+String(r.type||'')).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    if(fromQ&&String(r.date||'')<fromQ)return false;
    if(toQ&&String(r.date||'')>toQ)return false;
    return true;
  });

  var cntEl=document.getElementById('filterCount');
  if(cntEl)cntEl.textContent=filtered.length+' of '+ALL_REPORTS.length+' reports';

  var listEl=document.getElementById('reportList');
  if(!listEl)return;
  if(!filtered.length){listEl.innerHTML='<div class="pr-empty">No reports match your filters.</div>';return;}

  listEl.innerHTML=filtered.map(function(r){
    var typeLabel=r.type==='daily-report'?'Daily Report':'Site Readiness';
    // typeCls and statusCls are derived from whitelisted values — use E() as
    // defense-in-depth so server data never reaches an unescaped class attribute.
    var typeCls=E(r.type==='daily-report'?'daily':'sr');
    var statusKey=r.status==='sent'?'sent':(r.result==='READY'?'ready':(r.result==='NOT READY'?'not-ready':'draft'));
    var statusCls='status-'+E(statusKey);
    var statusLabel=r.result||r.status||'draft';
    var pdfHtml='';
    if(r.pdfWebUrl&&/^https:\/\//i.test(r.pdfWebUrl)){
      pdfHtml='<a href="'+E(r.pdfWebUrl)+'" target="_blank" rel="noopener" class="pr-pdf-link">View PDF</a>';
    } else if(r.pdfName){
      pdfHtml='<span class="pr-badge">'+E(r.pdfName)+'</span>';
    }
    return '<div class="pr-item">'
      +'<div class="pr-row">'
      +'<span class="pr-date">'+E(window.pfFmtDate(r.date)||r.date||'—')+'</span>'
      +'<span class="pr-project">'+E(r.projectName||r.projectId||'—')+'</span>'
      +'<span class="pr-badge '+typeCls+'">'+E(typeLabel)+'</span>'
      +'<span class="pr-badge '+statusCls+'">'+E(statusLabel)+'</span>'
      +(pdfHtml?pdfHtml:'')
      +'</div>'
      +(r.submittedAt?'<div style="font-size:11px;color:var(--text-3)">Submitted '+E(window.pfFmtDate((r.submittedAt||'').slice(0,10)))+'</div>':'')
      +'</div>';
  }).join('');
}
</script>
</body>
</html>
