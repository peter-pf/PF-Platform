<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PF Past Reports</title>
<meta name="theme-color" content="#006DB0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PF Field">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pf-r5.css">
<style>
  /* ---- Form base ---- */
  input,select,button{font-family:inherit;font-size:inherit;}
  input,select{background:var(--surface-3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:7px 10px;width:100%;}
  [data-theme="dark"] input,[data-theme="dark"] select{background:var(--surface-2);}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,109,176,.25);}
  /* ---- layout overrides ---- */
  #main{padding:14px;padding-bottom:max(24px,env(safe-area-inset-bottom));max-width:720px;margin:0 auto;}
  @media(min-width:900px){#main{max-width:1100px;margin-right:0;padding:18px 24px;}}
  /* ---- filter bar ---- */
  #filterBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
  #filterBar input,#filterBar select{background:var(--surface-3);}
  [data-theme="dark"] #filterBar input,[data-theme="dark"] #filterBar select{background:var(--surface-2);}
  #filterBar input#filterText{flex:1 1 160px;min-width:120px;}
  #filterBar select#filterType{flex:0 1 160px;min-width:120px;}
  #filterBar input#filterFrom,#filterBar input#filterTo{flex:0 1 130px;min-width:110px;}
  #filterBar label{font-size:12px;color:var(--text-3);white-space:nowrap;}
  #filterCount{font-size:12px;color:var(--text-3);padding-top:2px;}
  /* ---- report list ---- */
  .pr-item{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px;}
  .pr-item:hover{border-color:var(--accent);}
  .pr-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .pr-date{font-weight:700;font-size:14px;}
  .pr-project{font-size:14px;color:var(--text-2);}
  .pr-badge{font-size:11px;padding:2px 9px;border-radius:10px;background:var(--surface-3);color:var(--text-3);font-weight:600;white-space:nowrap;flex:0 0 auto;}
  .pr-badge.daily{background:rgba(0,109,176,.14);color:var(--accent-dark);}
  .pr-badge.sr{background:rgba(63,185,80,.15);color:var(--green);}
  .pr-badge.status-ready{background:rgba(63,185,80,.15);color:var(--green);}
  .pr-badge.status-not-ready{background:rgba(210,153,34,.15);color:var(--amber);}
  .pr-badge.status-sent{background:rgba(0,109,176,.14);color:var(--accent-dark);}
  .pr-badge.status-draft{background:var(--surface-3);color:var(--text-3);}
  [data-theme="dark"] .pr-badge.daily{color:#5bc8ff;}
  [data-theme="dark"] .pr-badge.status-sent{color:#5bc8ff;}
  .pr-pdf-link{font-size:12px;}
  .pr-empty{color:var(--text-3);font-size:14px;padding:24px 0;text-align:center;}
  .pr-err{color:var(--red);font-size:13px;padding:12px 0;}
</style>
<!-- No-flash theme: reads stored pref first, then prefers-color-scheme -->
<script>
(function(){try{var t=localStorage.getItem('pf-theme');var dark=t==='dark'||(t==null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);if(dark)document.documentElement.setAttribute('data-theme','dark');}catch(e){}}());
</script>
</head>
<body>

<div id="topbar">
  <a href="/" class="tb-brand" aria-label="PF Field Portal">
    <div class="tb-mark">PF</div>
    <span class="tb-title">Past Reports</span>
  </a>
  <details class="acct-menu" id="acctMenu">
    <summary>
      <span class="acct-btn">
        <span class="acct-name" id="acctName"></span>
        <svg class="acct-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </span>
    </summary>
    <div class="acct-dropdown">
      <button type="button" class="acct-item" onclick="window.pfToggleTheme()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
        <span id="acctThemeLabel">Dark mode</span>
      </button>
      <div class="acct-divider"></div>
      <a class="acct-item" href="/api/logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Sign Out
      </a>
    </div>
  </details>
</div>

<nav id="pfNav" aria-label="Main navigation">
  <a href="/" class="pf-nav-item" data-paths="/, /index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    <span>Home</span>
  </a>
  <a href="/daily-report.html" class="pf-nav-item" data-paths="/daily-report.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><line x1="9" y1="12" x2="15" y2="12"></line><line x1="9" y1="16" x2="13" y2="16"></line></svg>
    <span>Daily Report</span>
  </a>
  <a href="/site-readiness.html" class="pf-nav-item" data-paths="/site-readiness.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
    <span>Site Readiness</span>
  </a>
  <a href="/past-reports.html" class="pf-nav-item" data-paths="/past-reports.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    <span>Past Reports</span>
  </a>
  <a href="/cost-codes.html" class="pf-nav-item" data-paths="/cost-codes.html, /cost-codes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
    <span>Cost Codes</span>
  </a>
</nav>

<div id="loading">Loading...</div>
<div id="authError">
  <p>Session expired. <a href="/login.html">Sign in again</a></p>
</div>

<div id="main" style="display:none">
  <div id="filterBar">
    <input type="text" id="filterText" placeholder="Search project or type..." autocomplete="off" aria-label="Search">
    <select id="filterType" aria-label="Form type">
      <option value="">All types</option>
      <option value="daily-report">Daily Report</option>
      <option value="site-readiness">Site Readiness</option>
    </select>
    <label>From <input type="date" id="filterFrom" aria-label="From date"></label>
    <label>To <input type="date" id="filterTo" aria-label="To date"></label>
    <span id="filterCount"></span>
  </div>
  <div id="reportList"></div>
</div>

<script src="/js/pf-shared.js"></script>
<script>
"use strict";
/* ---- XSS escaper ---- */
window.esc = (function(){
  var m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return function(s){return s==null?'':String(s).replace(/[&<>"']/g,function(c){return m[c];});};
})();
window.pfFmtDate = function(s){
  if(!s)return'';
  var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m)return String(s);
  return m[2]+'/'+m[3]+'/'+m[1];
};

(function(){
  var loadEl=document.getElementById('loading');
  var mainEl=document.getElementById('main');
  var errEl=document.getElementById('authError');
  var userLbl=document.getElementById('userLabel');

  fetch('/api/me',{credentials:'same-origin'})
    .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
    .then(function(r){
      if(r.ok&&r.d&&r.d.status==='ok'){
        var acctNm=document.getElementById('acctName');
        if(acctNm)acctNm.textContent=r.d.name||'';
        if(userLbl)userLbl.textContent=r.d.name||r.d.role||'';
        if(loadEl)loadEl.style.display='none';
        if(mainEl)mainEl.style.display='block';
        loadReports();
      } else if(r.d&&r.d.status==='must_reset'){
        window.location.href='/reset-password.html';
      } else {
        window.location.href='/login.html?next='+encodeURIComponent(window.location.pathname);
      }
    })
    .catch(function(){
      if(loadEl)loadEl.style.display='none';
      if(errEl)errEl.style.display='block';
    });
})();

var ALL_REPORTS = [];
var E = window.esc;

function loadReports(){
  var listEl=document.getElementById('reportList');
  if(listEl)listEl.innerHTML='<div class="pr-empty">Loading reports...</div>';
  fetch('/api/past-reports',{credentials:'same-origin'})
    .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
    .then(function(r){
      if(!r.ok||!r.d||!r.d.ok){
        if(listEl)listEl.innerHTML='<div class="pr-err">Could not load reports. '+(r.d&&r.d.message?E(r.d.message):'')+'</div>';
        return;
      }
      ALL_REPORTS=(Array.isArray(r.d.reports)?r.d.reports:[]);
      wireFilters();
      renderList();
    })
    .catch(function(){
      if(listEl)listEl.innerHTML='<div class="pr-err">Network error loading reports.</div>';
    });
}

function wireFilters(){
  ['filterText','filterType','filterFrom','filterTo'].forEach(function(id){
    var el=document.getElementById(id);
    if(el&&!el.dataset.wired){el.dataset.wired='1';el.addEventListener('input',renderList);el.addEventListener('change',renderList);}
  });
}

function renderList(){
  var textQ=(document.getElementById('filterText')||{}).value||'';
  var typeQ=(document.getElementById('filterType')||{}).value||'';
  var fromQ=(document.getElementById('filterFrom')||{}).value||'';
  var toQ=(document.getElementById('filterTo')||{}).value||'';
  var q=textQ.toLowerCase().trim();

  var filtered=ALL_REPORTS.filter(function(r){
    if(typeQ&&r.type!==typeQ)return false;
    if(q){
      var hay=(String(r.projectName||'')+' '+String(r.projectId||'')+' '+String(r.type||'')).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    if(fromQ&&String(r.date||'')<fromQ)return false;
    if(toQ&&String(r.date||'')>toQ)return false;
    return true;
  });

  var cntEl=document.getElementById('filterCount');
  if(cntEl)cntEl.textContent=filtered.length+' of '+ALL_REPORTS.length+' reports';

  var listEl=document.getElementById('reportList');
  if(!listEl)return;
  if(!filtered.length){listEl.innerHTML='<div class="pr-empty">No reports match your filters.</div>';return;}

  listEl.innerHTML=filtered.map(function(r){
    var typeLabel=r.type==='daily-report'?'Daily Report':'Site Readiness';
    // typeCls and statusCls are derived from whitelisted values — use E() as
    // defense-in-depth so server data never reaches an unescaped class attribute.
    var typeCls=E(r.type==='daily-report'?'daily':'sr');
    var statusKey=r.status==='sent'?'sent':(r.result==='READY'?'ready':(r.result==='NOT READY'?'not-ready':'draft'));
    var statusCls='status-'+E(statusKey);
    var statusLabel=r.result||r.status||'draft';
    var pdfHtml='';
    if(r.pdfWebUrl&&/^https:\/\//i.test(r.pdfWebUrl)){
      pdfHtml='<a href="'+E(r.pdfWebUrl)+'" target="_blank" rel="noopener" class="pr-pdf-link">View PDF</a>';
    } else if(r.pdfName){
      pdfHtml='<span class="pr-badge">'+E(r.pdfName)+'</span>';
    }
    return '<div class="pr-item">'
      +'<div class="pr-row">'
      +'<span class="pr-date">'+E(window.pfFmtDate(r.date)||r.date||'—')+'</span>'
      +'<span class="pr-project">'+E(r.projectName||r.projectId||'—')+'</span>'
      +'<span class="pr-badge '+typeCls+'">'+E(typeLabel)+'</span>'
      +'<span class="pr-badge '+statusCls+'">'+E(statusLabel)+'</span>'
      +(pdfHtml?pdfHtml:'')
      +'</div>'
      +(r.submittedAt?'<div style="font-size:11px;color:var(--text-3)">Submitted '+E(window.pfFmtDate((r.submittedAt||'').slice(0,10)))+'</div>':'')
      +'</div>';
  }).join('');
}
</script>
</body>
</html>
