<html lang="en">
<head>

<style>
  /* ---- page-specific code tokens ---- */
  :root {
    --code-bg:#EEF2F7; --code-text:#1A4A7A;
    --js-bg:#DBEAFE;   --js-text:#1D4ED8;
    --section-bg:#F0F5FA; --group-bar:#F7F8FA;
  }
  [data-theme="dark"] {
    --code-bg:#0E2040; --code-text:#7BB8E8;
    --js-bg:rgba(59,130,246,.15); --js-text:#93C5FD;
    --section-bg:#161C25; --group-bar:#1b212c;
  }
  /* ---- layout override ---- */
  #main{display:none;padding:16px;padding-bottom:max(40px,env(safe-area-inset-bottom));max-width:860px;margin:0 auto;}
  @media(min-width:900px){#main{max-width:1000px;padding:20px 28px;}}
  /* ---- page header ---- */
  .cc-header{margin-bottom:14px;}
  .cc-title{font-size:1.18rem;font-weight:800;color:var(--text-0);letter-spacing:-.2px;}
  .cc-sub{font-size:.83rem;color:var(--text-2);margin-top:2px;}
  /* ---- search bar ---- */
  .cc-search-wrap{position:relative;background:var(--bg);padding:8px 0 10px;margin-bottom:6px;}
  .cc-search{width:100%;padding:10px 14px 10px 38px;font-size:15px;font-family:inherit;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text-0);outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;}
  .cc-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,109,176,.12);}
  .cc-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;width:18px;height:18px;margin-top:1px;}
  .cc-count{font-size:.75rem;color:var(--text-3);margin-top:4px;padding-left:2px;}
  /* ---- group heading ---- */
  .cc-group{margin-bottom:18px;}
  .cc-group-head{font-size:.72rem;font-weight:700;letter-spacing:.55px;text-transform:uppercase;color:var(--text-2);padding:7px 10px;background:var(--group-bar);border-radius:8px;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .cc-group-head .cg-count{font-size:.68rem;font-weight:600;letter-spacing:.2px;text-transform:none;color:var(--text-3);margin-left:auto;}
  /* ---- section heading ---- */
  .cc-section-head{font-size:.78rem;font-weight:600;color:var(--text-2);padding:5px 10px 2px;margin-top:6px;margin-bottom:1px;letter-spacing:.1px;}
  /* ---- code row ---- */
  .cc-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent;}
  .cc-row:hover{background:var(--bg-2);}
  .cc-row:active{background:var(--border);}
  .cc-code{font-family:'SF Mono','Fira Mono','Consolas','Liberation Mono',monospace;font-size:.82rem;font-weight:600;letter-spacing:.3px;background:var(--code-bg);color:var(--code-text);padding:2px 7px;border-radius:5px;white-space:nowrap;flex:0 0 auto;min-width:54px;text-align:center;}
  .cc-name{flex:1 1 auto;font-size:.9rem;color:var(--text-1);line-height:1.3;}
  .cc-row-hl1 .cc-code{background:var(--accent-light);color:var(--accent-dark);font-size:.85rem;}
  [data-theme="dark"] .cc-row-hl1 .cc-code{background:rgba(0,109,176,.22);color:#a8d4f5;}
  .cc-row-hl1 .cc-name{font-weight:700;color:var(--text-0);}
  .cc-row-hl2 .cc-name{font-weight:600;color:var(--text-0);font-size:.88rem;}
  .cc-js{font-size:.7rem;font-weight:600;letter-spacing:.2px;background:var(--js-bg);color:var(--js-text);padding:2px 6px;border-radius:4px;white-space:nowrap;flex:0 0 auto;}
  /* ---- no results ---- */
  .cc-empty{text-align:center;padding:32px 16px;color:var(--text-3);font-size:.9rem;}
  /* ---- two-column layout on wide screens ---- */
  @media(min-width:640px){
    #ccGroups{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;align-items:start;}
    .cc-group[data-group="Job Expenses"]{grid-column:1/-1;}
    #ccGroups.search-active{display:block;}
    .cc-empty{grid-column:1/-1;}
  }
  /* ---- toast ---- */
  #ccToast{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);left:50%;transform:translateX(-50%) translateY(8px);background:#1A2A3A;color:#fff;font-size:.82rem;font-weight:600;padding:8px 16px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .18s, transform .18s;z-index:200;white-space:nowrap;letter-spacing:.1px;}
  #ccToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media(min-width:900px){#ccToast{bottom:20px;left:calc(var(--sidebar-w) + 50%);transform:translateX(-50%) translateY(8px);}#ccToast.show{transform:translateX(-50%) translateY(0);}}
</style>
<!-- No-flash theme -->
<script>
(function(){try{var t=localStorage.getItem('pf-theme');var dark=t==='dark'||(t==null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);if(dark)document.documentElement.setAttribute('data-theme','dark');}catch(e){}}());
</script>
</head>
<body>

    <div class="acct-dropdown">
      <button type="button" class="acct-item" onclick="window.pfToggleTheme()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
        <span id="acctThemeLabel">Dark mode</span>
      </button>
      <div class="acct-divider"></div>
      <a class="acct-item" href="/api/logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Sign Out

</div>

<div id="loading">Loading...</div>
<div id="authError"><p>Session expired. <a href="/login.html">Sign in again</a></p></div>

<div id="main">

  <div class="cc-header">
    <div class="cc-title">Cost Codes</div>
    <div class="cc-sub">Job expenses (5000-5600) and non-job materials &amp; travel (7500-7635). Tap any row to copy the code.</div>
  </div>

  <div class="cc-search-wrap">
    <svg class="cc-search-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
    </svg>
    <input
      type="search"
      id="ccSearch"
      class="cc-search"
      placeholder="Search by code or name…"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      aria-label="Search cost codes"
    >
    <div class="cc-count" id="ccCount" aria-live="polite"></div>
  </div>

  <div id="ccGroups" role="list" aria-label="Cost codes list"></div>

<div id="ccToast" role="status" aria-live="polite"></div>

<script src="/js/pf-shared.js"></script>
<script>
"use strict";

/* ---- XSS escaper ---- */
window.esc = (function(){
  var m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return function(s){return s==null?'':String(s).replace(/[&<>"']/g,function(c){return m[c];});};
})();

/* ---- Toast ---- */
var toastTimer = null;
function showToast(msg) {
  var t = document.getElementById('ccToast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* ---- Copy code ---- */
function copyCode(code) {
  if (!code) return;
  try {
    navigator.clipboard.writeText(code).then(function(){
      showToast('Copied ' + code);
    }).catch(function(){
      legacyCopy(code);
    });
  } catch(e) {
    legacyCopy(code);
  }
}
function legacyCopy(code) {
  try {
    var ta = document.createElement('textarea');
    ta.value = code;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Copied ' + code);
  } catch(e) {
    showToast(code);
  }
}

/* ---- Render ---- */
var ALL_CODES = [];

function buildGroupHtml(groupName, items) {
  if (!items.length) return '';
  var rows = '';
  var lastSection = null;
  for (var i = 0; i < items.length; i++) {
    var c = items[i];
    // Insert section sub-heading when section changes (level-2 heading rows get a special marker)
    if (c.headingLevel === 2) {
      rows += '<div class="cc-section-head" aria-hidden="true">' + esc(c.name) + '</div>';
    }
    var hlClass = c.headingLevel === 1 ? 'cc-row-hl1' : c.headingLevel === 2 ? 'cc-row-hl2' : '';
    var jsBadge = c.jobSpecific ? '<span class="cc-js" aria-label="Job specific">Job specific</span>' : '';
    rows += '<div class="cc-row ' + hlClass + '" role="listitem" data-code="' + esc(c.code) + '" aria-label="Code ' + esc(c.code) + ': ' + esc(c.name) + (c.jobSpecific ? ', Job specific' : '') + '. Tap to copy." tabindex="0">';
    rows += '<span class="cc-code">' + esc(c.code) + '</span>';
    rows += '<span class="cc-name">' + esc(c.name) + '</span>';
    rows += jsBadge;
    rows += '</div>';
  }
  return '<div class="cc-group" data-group="' + esc(groupName) + '" role="group" aria-label="' + esc(groupName) + '">'
       + '<div class="cc-group-head"><span>' + esc(groupName) + '</span>'
       + '<span class="cg-count" id="cg-count-' + esc(groupName.replace(/[^a-z0-9]/gi,'_')) + '">' + items.length + ' codes</span></div>'
       + rows + '</div>';
}

function render(codes) {
  var container = document.getElementById('ccGroups');
  if (!container) return;
  if (!codes || !codes.length) {
    container.innerHTML = '<div class="cc-empty">No codes to display.</div>';
    return;
  }
  // Group by group field, preserving first-seen order
  var groupOrder = [];
  var groupMap = {};
  for (var i = 0; i < codes.length; i++) {
    var c = codes[i];
    var g = c.group || 'Other';
    if (!groupMap[g]) { groupMap[g] = []; groupOrder.push(g); }
    groupMap[g].push(c);
  }
  var html = '';
  for (var j = 0; j < groupOrder.length; j++) {
    html += buildGroupHtml(groupOrder[j], groupMap[groupOrder[j]]);
  }
  container.innerHTML = html;
  // Attach click handlers to rows
  container.querySelectorAll('.cc-row[data-code]').forEach(function(row) {
    row.addEventListener('click', function(){ copyCode(row.getAttribute('data-code')); });
    row.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copyCode(row.getAttribute('data-code')); }
    });
  });
}

function updateCount(visible, total) {
  var el = document.getElementById('ccCount');
  if (!el) return;
  if (visible === total) {
    el.textContent = total + ' codes';
  } else {
    el.textContent = visible + ' of ' + total + ' codes';
  }
}

function filterAndRender(query) {
  var container = document.getElementById('ccGroups');
  if (!container) return;
  var q = (query || '').trim().toLowerCase();
  if (!q) {
    render(ALL_CODES);
    updateCount(ALL_CODES.length, ALL_CODES.length);
    container.classList.remove('search-active');
    return;
  }
  container.classList.add('search-active');
  // Match code starts-with first, then name contains
  var matches = ALL_CODES.filter(function(c){
    return c.code.toLowerCase().indexOf(q) >= 0 ||
           c.name.toLowerCase().indexOf(q) >= 0;
  });
  render(matches);
  updateCount(matches.length, ALL_CODES.length);
  if (!matches.length) {
    container.innerHTML = '<div class="cc-empty">No codes match "<strong>' + esc(q) + '</strong>".</div>';
  }
}

/* ---- Auth + load ---- */
(function(){
  var loadEl  = document.getElementById('loading');
  var mainEl  = document.getElementById('main');
  var errEl   = document.getElementById('authError');
  var userLbl = document.getElementById('userLabel');

  fetch('/api/me', {credentials:'same-origin'})
    .then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
    .then(function(r){
      if(r.ok && r.d && r.d.status==='ok'){
        var name = r.d.name || r.d.role || '';
        var acctNm = document.getElementById('acctName');
        if(acctNm) acctNm.textContent = r.d.name || '';
        if(userLbl) userLbl.textContent = name;
        return fetch('/api/cost-codes', {credentials:'same-origin'});
      } else if(r.d && r.d.status==='must_reset'){
        window.location.href='/reset-password.html';
        return null;
      } else {
        window.location.href='/login.html?next='+encodeURIComponent(window.location.pathname);
        return null;
      }
    })
    .then(function(r){
      if (!r) return null;
      return r.json().then(function(d){return{ok:r.ok,d:d};});
    })
    .then(function(r){
      if (!r) return;
      if(loadEl) loadEl.style.display='none';
      if(r.ok && r.d && r.d.ok){
        ALL_CODES = r.d.codes || [];
        render(ALL_CODES);
        updateCount(ALL_CODES.length, ALL_CODES.length);
        if(mainEl) mainEl.style.display='block';
        // Wire search
        var searchEl = document.getElementById('ccSearch');
        if (searchEl) {
          searchEl.addEventListener('input', function(){
            filterAndRender(searchEl.value);
          });
        }
      } else {
        if(mainEl) mainEl.style.display='block';
        var container = document.getElementById('ccGroups');
        if(container) container.innerHTML = '<div class="cc-empty">Unable to load codes.</div>';
      }
    })
    .catch(function(){
      if(loadEl) loadEl.style.display='none';
      if(errEl) errEl.style.display='block';
    });
})();
</script>
</body>
