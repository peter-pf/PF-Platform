<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign in - PF Field Portal</title>
<meta name="theme-color" content="#1F6FB2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PF Field">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#006DB0;
    --accent-dark:#005A91;
    --accent-light:#E0F0FF;
    --text:#2B2F36;
    --text-soft:#5A6472;
    --border:#D9DEE6;
    --bg:#F2F5F9;
    --bg-grad:linear-gradient(135deg,#E9F1F8 0%,#F2F5F9 60%,#FFFFFF 100%);
    --card:#FFFFFF;
    --error:#B4232A;
    --input-bg:#FBFCFE;
  }
  [data-theme="dark"]{
    --text:#E2E8F0;
    --text-soft:#8A9AAB;
    --border:#2A2F3A;
    --bg:#131820;
    --bg-grad:linear-gradient(135deg,#0F1823 0%,#131820 60%,#1b212c 100%);
    --card:#1b212c;
    --error:#F87171;
    --input-bg:#222830;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text);
    background:var(--bg-grad);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .login-box{
    width:100%;max-width:380px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 12px 40px rgba(0,40,80,0.10);
    padding:36px 32px 30px;
    color:var(--text);
  }
  .brand{
    text-align:center;margin-bottom:22px;
  }
  .brand .mark{
    display:inline-flex;align-items:center;justify-content:center;
    width:56px;height:56px;border-radius:14px;
    background:var(--accent);color:#fff;
    font-weight:700;font-size:1.4rem;letter-spacing:0.5px;
    margin-bottom:12px;
  }
  .brand h1{
    font-size:1.18rem;font-weight:700;margin:0;color:var(--text);
  }
  .brand p{
    font-size:0.86rem;color:var(--text-soft);margin:4px 0 0;
  }
  label{
    display:block;font-size:0.8rem;font-weight:600;color:var(--text-soft);
    margin:14px 0 5px;
  }
  input[type=email],input[type=password]{
    width:100%;padding:11px 13px;
    border:1px solid var(--border);border-radius:8px;
    font-size:0.95rem;font-family:inherit;color:var(--text);
    background:var(--input-bg);transition:border-color .15s, box-shadow .15s;
  }
  input:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-light);
  }
  button{
    width:100%;margin-top:22px;padding:12px;
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    font-size:0.98rem;font-weight:600;font-family:inherit;cursor:pointer;
    transition:background .15s;
  }
  button:hover{background:var(--accent-dark);}
  button:disabled{opacity:0.6;cursor:default;}
  .error{
    display:none;margin-top:16px;padding:10px 12px;
    background:rgba(180,35,42,.08);border:1px solid rgba(180,35,42,.25);border-radius:8px;
    color:var(--error);font-size:0.86rem;
  }
  .error.show{display:block;}
  .foot{
    text-align:center;margin-top:20px;
    font-size:0.76rem;color:var(--text-soft);line-height:1.5;
  }
</style>
<!-- No-flash theme: runs before body renders -->
<script>
(function(){try{var t=localStorage.getItem('pf-theme');var dark=t==='dark'||(t==null&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);if(dark)document.documentElement.setAttribute('data-theme','dark');}catch(e){}}());
</script>
</head>
<body>
  <form class="login-box" id="loginForm" autocomplete="on">
    <div class="brand">
      <div class="mark">PF</div>
      <h1>PF Field Portal</h1>
      <p>Sign in with your account</p>
    </div>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="username"
           required autofocus placeholder="you@pierfoundations.com">

    <label for="password">Password</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required placeholder="Your password">

    <button type="submit" id="submitBtn">Sign in</button>

    <div class="error" id="errorBox" role="alert"></div>

    <div class="foot">
      Field access - authorized users only.<br>
      Trouble signing in? Contact Brad.
    </div>
  </form>

<script>
(function () {
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('submitBtn');
  var errBox = document.getElementById('errorBox');

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
  }
  function clearError() {
    errBox.textContent = '';
    errBox.classList.remove('show');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ email: email, password: password })
    })
    .then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, data: data }; });
    })
    .then(function (r) {
      if (r.ok && r.data.status === 'ok') {
        // Honor a ?next= return path if present and same-origin, else go home.
        // STRICT same-origin path: must start with "/" and the second char must
        // NOT be "/" or "\" (blocks //evil.com and /\evil.com open redirects).
        var params = new URLSearchParams(window.location.search);
        var next = params.get('next');
        var dest = '/';
        if (next && /^\/[^/\\]/.test(next)) dest = next;
        if (r.data.must_reset) {
          window.location.href = '/reset-password.html';
        } else {
          window.location.href = dest;
        }
      } else {
        showError((r.data && r.data.message) || 'Invalid email or password.');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    })
    .catch(function () {
      showError('Could not reach the server. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Sign in';
    });
  });
})();
</script>
</body>
</html>
