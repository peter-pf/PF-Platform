<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Set Password - PF Field Portal</title>
<style>
  :root{
    --accent:#006DB0;--accent-dark:#005A91;--accent-light:#E0F0FF;
    --text:#2B2F36;--text-soft:#5A6472;--border:#D9DEE6;--error:#B4232A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
    color:var(--text);background:linear-gradient(135deg,#E9F1F8 0%,#F2F5F9 60%,#FFFFFF 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .box{width:100%;max-width:400px;background:#fff;border:1px solid var(--border);
    border-radius:14px;box-shadow:0 12px 40px rgba(0,40,80,.10);padding:36px 32px 30px;}
  .brand{text-align:center;margin-bottom:22px;}
  .brand .mark{display:inline-flex;align-items:center;justify-content:center;
    width:48px;height:48px;border-radius:12px;background:var(--accent);color:#fff;
    font-weight:700;font-size:1.3rem;margin-bottom:10px;}
  h1{font-size:1.1rem;font-weight:700;margin:0;color:var(--text);}
  .sub{font-size:0.86rem;color:var(--text-soft);margin:4px 0 0;}
  label{display:block;font-size:0.8rem;font-weight:600;color:var(--text-soft);margin:14px 0 5px;}
  input[type=password]{width:100%;padding:11px 13px;border:1px solid var(--border);
    border-radius:8px;font-size:0.95rem;font-family:inherit;color:var(--text);
    background:#FBFCFE;transition:border-color .15s,box-shadow .15s;}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
  button{width:100%;margin-top:20px;padding:12px;background:var(--accent);color:#fff;
    border:none;border-radius:8px;font-size:0.98rem;font-weight:600;font-family:inherit;
    cursor:pointer;transition:background .15s;}
  button:hover{background:var(--accent-dark);}
  button:disabled{opacity:.6;cursor:default;}
  .msg{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;font-size:.86rem;}
  .msg.err{display:block;background:#FCEBEC;border:1px solid #F2C4C7;color:var(--error);}
  .msg.ok{display:block;background:#EAFAF0;border:1px solid #A6DFBD;color:#1A6B3C;}
  .hint{font-size:.78rem;color:var(--text-soft);margin-top:6px;}
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <div class="mark">PF</div>
    <h1>Set your password</h1>
    <p class="sub">You are using a temporary password. Choose a new one to continue.</p>
  </div>

  <label for="pw">New password</label>
  <input type="password" id="pw" autocomplete="new-password" placeholder="At least 12 characters">
  <p class="hint">Minimum 12 characters.</p>

  <label for="pw2">Confirm new password</label>
  <input type="password" id="pw2" autocomplete="new-password" placeholder="Repeat password">

  <button type="button" id="btn">Set password</button>
  <div class="msg" id="msg"></div>
</div>

<script>
(function () {
  var btn = document.getElementById('btn');
  var msgEl = document.getElementById('msg');

  function show(txt, isErr) {
    msgEl.textContent = txt;
    msgEl.className = 'msg ' + (isErr ? 'err' : 'ok');
  }

  btn.addEventListener('click', function () {
    var pw = document.getElementById('pw').value;
    var pw2 = document.getElementById('pw2').value;
    if (!pw || pw.length < 12) { show('Password must be at least 12 characters.', true); return; }
    if (pw !== pw2) { show('Passwords do not match.', true); return; }
    btn.disabled = true;
    btn.textContent = 'Saving...';
    msgEl.className = 'msg';

    fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ password: pw, confirm: pw2 })
    })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (r) {
      if (r.ok && r.d.status === 'ok') {
        show('Password set. Taking you in...', false);
        setTimeout(function () { window.location.href = r.d.redirect || '/'; }, 1200);
      } else {
        show((r.d && r.d.message) || 'Could not set password.', true);
        btn.disabled = false; btn.textContent = 'Set password';
      }
    })
    .catch(function () {
      show('Network error. Please try again.', true);
      btn.disabled = false; btn.textContent = 'Set password';
    });
  });
})();
</script>
</body>
</html>
