<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vendors | PF Field Portal</title>
  <link rel="stylesheet" href="pf-r5.css">
  <script src="/js/pf-shared.js"></script>
  <style>
    /* ---- Vendors page styles ---- */

    /* Section tabs */
    .vn-tab-bar {
      display: flex;
      gap: 6px;
      padding: 10px 16px 0;
      flex-wrap: wrap;
      align-items: center;
    }
    .vn-tab-btn {
      padding: 7px 14px;
      border: 1.5px solid var(--pf-blue, #1a56db);
      border-radius: 20px;
      background: transparent;
      color: var(--pf-blue, #1a56db);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.14s, color 0.14s;
      white-space: nowrap;
    }
    .vn-tab-btn.active {
      background: var(--pf-blue, #1a56db);
      color: #fff;
    }
    .vn-tab-rename-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--pf-blue, #1a56db);
      font-size: 0.75rem;
      padding: 2px 4px;
      vertical-align: middle;
      margin-left: 2px;
      opacity: 0.7;
    }
    .vn-tab-rename-btn:hover { opacity: 1; }

    /* Search + action bar */
    .vn-action-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px 0;
      align-items: center;
    }
    .vn-search {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid #ccd;
      border-radius: 8px;
      font-size: 0.95rem;
      background: var(--input-bg, #fff);
      color: var(--text, #111);
      min-width: 0;
    }
    .vn-search:focus { outline: none; border-color: var(--pf-blue, #1a56db); }
    .vn-add-btn {
      flex: 0 0 auto;
      padding: 8px 14px;
      background: var(--pf-blue, #1a56db);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .vn-add-sec-btn {
      flex: 0 0 auto;
      padding: 8px 10px;
      background: transparent;
      color: var(--pf-blue, #1a56db);
      border: 1.5px solid var(--pf-blue, #1a56db);
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Vendor card list */
    .vn-list {
      padding: 10px 16px 80px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .vn-card {
      background: var(--card-bg, #fff);
      border: 1px solid #dde;
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
    }
    .vn-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .vn-company {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text, #111);
      word-break: break-word;
    }
    .vn-category {
      font-size: 0.78rem;
      color: #667;
      margin-top: 2px;
    }
    .vn-card-actions {
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
    }
    .vn-edit-btn, .vn-del-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .vn-edit-btn { color: var(--pf-blue, #1a56db); }
    .vn-del-btn  { color: #c00; }
    .vn-edit-btn:hover { background: rgba(26,86,219,.08); }
    .vn-del-btn:hover  { background: rgba(200,0,0,.08); }

    /* Detail rows */
    .vn-details {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .vn-detail-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.84rem;
    }
    .vn-detail-label {
      flex: 0 0 72px;
      color: #667;
      font-size: 0.78rem;
    }
    .vn-detail-val {
      color: var(--text, #111);
      word-break: break-word;
    }
    .vn-detail-val a {
      color: var(--pf-blue, #1a56db);
      text-decoration: none;
    }
    .vn-detail-val a:hover { text-decoration: underline; }

    .vn-updated {
      margin-top: 6px;
      font-size: 0.72rem;
      color: #999;
    }
    .vn-empty {
      padding: 32px 16px;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }
    .vn-error {
      padding: 12px 16px;
      color: #c00;
      font-size: 0.9rem;
    }

    /* ---- Bottom sheet (add/edit) ---- */
    .vn-sheet-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 8000;
      background: rgba(0,0,0,0.42);
    }
    .vn-sheet-backdrop.open { display: block; }
    .vn-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 8001;
      background: var(--card-bg, #fff);
      border-radius: 16px 16px 0 0;
      padding: 0 0 env(safe-area-inset-bottom, 0);
      box-shadow: 0 -4px 24px rgba(0,0,0,.15);
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.22s cubic-bezier(0.32,0,0.67,0);
    }
    .vn-sheet.open {
      transform: translateY(0);
    }
    .vn-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 10px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: var(--card-bg, #fff);
      z-index: 1;
    }
    .vn-sheet-title {
      font-size: 1rem;
      font-weight: 700;
    }
    .vn-sheet-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.3rem;
      color: #666;
      padding: 4px 8px;
    }
    .vn-sheet-body {
      padding: 14px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .vn-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .vn-field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
    }
    .vn-field input, .vn-field textarea, .vn-field select {
      padding: 9px 11px;
      border: 1.5px solid #ccd;
      border-radius: 8px;
      font-size: 0.95rem;
      background: var(--input-bg, #fff);
      color: var(--text, #111);
      font-family: inherit;
    }
    .vn-field input:focus, .vn-field textarea:focus, .vn-field select:focus {
      outline: none;
      border-color: var(--pf-blue, #1a56db);
    }
    .vn-field textarea { resize: vertical; min-height: 60px; }
    .vn-required-star { color: #c00; margin-left: 2px; }
    .vn-sheet-save-btn {
      width: 100%;
      padding: 12px;
      background: var(--pf-blue, #1a56db);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }
    .vn-sheet-save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .vn-sheet-err {
      color: #c00;
      font-size: 0.85rem;
      display: none;
    }
    .vn-sheet-err.show { display: block; }

    /* ---- Delete confirm dialog ---- */
    .vn-confirm-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
    }
    .vn-confirm-backdrop.open { display: flex; }
    .vn-confirm-dialog {
      background: var(--card-bg, #fff);
      border-radius: 12px;
      padding: 20px 20px 16px;
      margin: 16px;
      max-width: 340px;
      width: 100%;
    }
    .vn-confirm-title { font-weight: 700; font-size: 1rem; margin-bottom: 8px; }
    .vn-confirm-msg   { font-size: 0.9rem; color: #555; margin-bottom: 16px; }
    .vn-confirm-btns  { display: flex; gap: 8px; justify-content: flex-end; }
    .vn-confirm-cancel {
      padding: 8px 16px; border: 1.5px solid #ccc; border-radius: 8px;
      background: none; cursor: pointer; font-size: 0.9rem;
    }
    .vn-confirm-delete {
      padding: 8px 16px; background: #c00; color: #fff;
      border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
      font-weight: 700;
    }
    .vn-confirm-delete:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>

<script>
(function() {
  'use strict';

  // ---- State ------------------------------------------------------------
  var _sections   = [];      // [{id, name, sort_order}]
  var _items      = {};      // {section_id: [{...}]}
  var _activeSec  = null;    // current section id
  var _canEdit    = false;   // set from api/me response (vendorsAllowed implies read; edit gated separately)
  var _pendingDel = null;    // {type: 'item'|'section', id, name}
  var _editId     = null;    // null = add mode, string = edit mode

  var loadEl  = document.getElementById('loading');
  var mainEl  = document.getElementById('main');
  var errEl   = document.getElementById('authError');
  var acctNm  = document.getElementById('acctName');

  // ---- Auth init (async IIFE) -------------------------------------------
  (async function vnAuthInit() {
    var me;
    try {
      var r = await fetch('/api/me', {credentials: 'same-origin'});
      me = await r.json();
    } catch (e) {
      me = {status: 'error'};
    }
    if (!me || me.status !== 'ok') {
      if (errEl) errEl.style.display = 'block';
      return;
    }
    if (acctNm) acctNm.textContent = me.name || '';

    // Show/hide hardware nav (this page; vnNavItem is always visible here)
    try{var _hwNav=document.getElementById('hwNavItem');if(_hwNav&&me.hardwareAllowed) _hwNav.style.display='';}catch(e){}
    try{var _slNav=document.getElementById('slNavItem');if(_slNav&&me.serviceLogAllowed) _slNav.style.display='';}catch(e){}

    // Owner-only: mailing lists nav
    var _mlNav = document.getElementById('mlNavItem');
    var _em = (me.email || '').toLowerCase();
    if (_mlNav && ['breinking@pierfoundations.com','jreinking@pierfoundations.com','dfranke@pierfoundations.com'].indexOf(_em) >= 0) {
      _mlNav.style.display = '';
    }

    // Dark mode label
    var themeLabel = document.getElementById('acctThemeLabel');
    if (themeLabel && window.pfGetTheme) {
      themeLabel.textContent = window.pfGetTheme() === 'dark' ? 'Light mode' : 'Dark mode';
    }

    if (mainEl) mainEl.style.display = 'block';

    // Determine edit access — use vendorsCanEdit (server enforces independently; this is UI only).
    // vendorsCanEdit is narrower than vendorsAllowed: when GO_LIVE=true, reads open to all
    // users while writes stay restricted to VENDORS_EDITORS. Using vendorsAllowed here
    // would show edit buttons to users who would then get 403 on submit.
    _canEdit = !!me.vendorsCanEdit;

    await vnInit();
  })();

  // ---- Init ------------------------------------------------------------
  async function vnInit() {
    // Apply seed first (idempotent — only runs if tables are empty)
    if (_canEdit) {
      try {
        await fetch('/api/vendors', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action: 'seed'}),
        });
      } catch (e) {
        // non-fatal
      }
    }

    await vnLoadData();
  }

  async function vnLoadData() {
    var errDiv = document.getElementById('vnError');
    errDiv.style.display = 'none';
    errDiv.textContent = '';
    try {
      var r = await fetch('/api/vendors', {credentials: 'same-origin'});
      var d = await r.json();
      if (!d.ok) {
        errDiv.textContent = window.esc ? window.esc(d.error || 'Failed to load vendors.') : (d.error || 'Failed to load vendors.');
        errDiv.style.display = 'block';
        return;
      }
      _sections = Array.isArray(d.sections) ? d.sections : [];
      _items    = (d.items && typeof d.items === 'object') ? d.items : {};

      // Set active section to first if not set or section no longer exists
      var secIds = _sections.map(function(s){ return s.id; });
      if (!_activeSec || secIds.indexOf(_activeSec) < 0) {
        _activeSec = _sections.length > 0 ? _sections[0].id : null;
      }

      vnRenderTabs();
      vnRenderList();
    } catch (e) {
      errDiv.textContent = 'Network error loading vendors.';
      errDiv.style.display = 'block';
    }
  }

  // ---- Render tabs -----------------------------------------------------
  function vnRenderTabs() {
    var bar = document.getElementById('vnTabBar');
    bar.innerHTML = '';

    _sections.forEach(function(sec) {
      var btn = document.createElement('button');
      btn.className = 'vn-tab-btn' + (sec.id === _activeSec ? ' active' : '');
      btn.textContent = '';
      btn.appendChild(document.createTextNode(window.esc ? '' : ''));

      // Use textContent for safety
      btn.textContent = sec.name;
      btn.setAttribute('data-secid', sec.id);
      btn.addEventListener('click', function() {
        _activeSec = sec.id;
        vnRenderTabs();
        vnRenderList();
      });

      if (_canEdit) {
        var renBtn = document.createElement('button');
        renBtn.className = 'vn-tab-rename-btn';
        renBtn.setAttribute('aria-label', 'Rename section');
        renBtn.textContent = '✎'; // pencil
        renBtn.setAttribute('data-secid', sec.id);
        renBtn.setAttribute('data-secname', sec.name);
        renBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          vnOpenRenameSection(sec.id, sec.name);
        });
        btn.appendChild(renBtn);
      }
      bar.appendChild(btn);
    });

    // Show/hide action bar + edit buttons
    var actionBar = document.getElementById('vnActionBar');
    actionBar.style.display = '';
    var addBtn    = document.getElementById('vnAddBtn');
    var addSecBtn = document.getElementById('vnAddSecBtn');
    if (addBtn)    addBtn.style.display    = _canEdit ? '' : 'none';
    if (addSecBtn) addSecBtn.style.display = _canEdit ? '' : 'none';
  }

  // ---- Render card list ------------------------------------------------
  function vnRenderList() {
    var list = document.getElementById('vnList');
    list.innerHTML = '';

    if (_sections.length === 0) {
      var emp = document.createElement('div');
      emp.className = 'vn-empty';
      emp.textContent = _canEdit
        ? 'No sections yet. Use "+ Section" to create one.'
        : 'No vendors added yet.';
      list.appendChild(emp);
      return;
    }

    if (!_activeSec) return;

    var query = (document.getElementById('vnSearch').value || '').toLowerCase().trim();
    var secItems = _items[_activeSec] || [];

    var filtered = query ? secItems.filter(function(it) {
      return (it.company || '').toLowerCase().indexOf(query) >= 0
          || (it.category || '').toLowerCase().indexOf(query) >= 0
          || (it.contact  || '').toLowerCase().indexOf(query) >= 0
          || (it.phone    || '').toLowerCase().indexOf(query) >= 0
          || (it.notes    || '').toLowerCase().indexOf(query) >= 0;
    }) : secItems;

    if (filtered.length === 0) {
      var emp2 = document.createElement('div');
      emp2.className = 'vn-empty';
      emp2.textContent = query
        ? 'No vendors match your search.'
        : (_canEdit ? 'No vendors in this section yet. Tap "+ Add Vendor" to add one.' : 'No vendors in this section yet.');
      list.appendChild(emp2);
      return;
    }

    filtered.forEach(function(item) {
      list.appendChild(vnBuildCard(item));
    });
  }

  function vnBuildCard(item) {
    var e = window.esc || function(s){ return String(s||''); };

    var card = document.createElement('div');
    card.className = 'vn-card';

    var header = document.createElement('div');
    header.className = 'vn-card-header';

    var info = document.createElement('div');
    var company = document.createElement('div');
    company.className = 'vn-company';
    company.textContent = item.company || '';
    info.appendChild(company);

    if (item.category) {
      var cat = document.createElement('div');
      cat.className = 'vn-category';
      cat.textContent = item.category;
      info.appendChild(cat);
    }
    header.appendChild(info);

    if (_canEdit) {
      var acts = document.createElement('div');
      acts.className = 'vn-card-actions';

      var editBtn = document.createElement('button');
      editBtn.className = 'vn-edit-btn';
      editBtn.textContent = 'Edit';
      editBtn.setAttribute('aria-label', 'Edit ' + (item.company || 'vendor'));
      editBtn.addEventListener('click', function() { vnOpenEdit(item); });

      var delBtn = document.createElement('button');
      delBtn.className = 'vn-del-btn';
      delBtn.textContent = 'Delete';
      delBtn.setAttribute('aria-label', 'Delete ' + (item.company || 'vendor'));
      delBtn.addEventListener('click', function() { vnConfirmDelete('item', item.id, item.company || 'this vendor'); });

      acts.appendChild(editBtn);
      acts.appendChild(delBtn);
      header.appendChild(acts);
    }
    card.appendChild(header);

    // Detail rows
    var details = document.createElement('div');
    details.className = 'vn-details';

    function addRow(label, value, isLink, linkHref) {
      if (!value) return;
      var row = document.createElement('div');
      row.className = 'vn-detail-row';
      var lbl = document.createElement('span');
      lbl.className = 'vn-detail-label';
      lbl.textContent = label;
      var val = document.createElement('span');
      val.className = 'vn-detail-val';
      if (isLink && linkHref) {
        var a = document.createElement('a');
        a.href = linkHref;
        if (linkHref.startsWith('tel:') || linkHref.startsWith('http')) {
          a.setAttribute('rel', 'noopener');
          if (linkHref.startsWith('http')) a.target = '_blank';
        }
        a.textContent = value;
        val.appendChild(a);
      } else {
        val.textContent = value;
      }
      row.appendChild(lbl);
      row.appendChild(val);
      details.appendChild(row);
    }

    if (item.contact) addRow('Contact', item.contact, false, null);
    if (item.phone)   addRow('Phone',   item.phone,   true,  'tel:' + item.phone.replace(/\s/g,''));
    if (item.address) {
      var mapsHref = 'https://maps.google.com/?q=' + encodeURIComponent(item.address);
      addRow('Address', item.address, true, mapsHref);
    }
    if (item.website) {
      var siteHref = item.website.startsWith('http') ? item.website : 'https://' + item.website;
      addRow('Website', item.website, true, siteHref);
    }
    if (item.account_num) addRow('Account #', item.account_num, false, null);
    if (item.notes)       addRow('Notes',     item.notes,       false, null);

    if (details.children.length > 0) card.appendChild(details);

    if (item.updated_by && item.updated_at) {
      var upd = document.createElement('div');
      upd.className = 'vn-updated';
      var ts = item.updated_at ? item.updated_at.replace('T',' ').slice(0,16) : '';
      upd.textContent = 'Updated by ' + (item.updated_by || '') + (ts ? ' on ' + ts : '');
      card.appendChild(upd);
    }

    return card;
  }

  // ---- Add / Edit sheet ------------------------------------------------
  function vnOpenAdd() {
    _editId = null;
    document.getElementById('vnSheetTitle').textContent = 'Add Vendor';
    document.getElementById('vnEditId').value = '';
    document.getElementById('vnFldCompany').value  = '';
    document.getElementById('vnFldCategory').value = '';
    document.getElementById('vnFldContact').value  = '';
    document.getElementById('vnFldPhone').value    = '';
    document.getElementById('vnFldAddress').value  = '';
    document.getElementById('vnFldWebsite').value  = '';
    document.getElementById('vnFldAccount').value  = '';
    document.getElementById('vnFldNotes').value    = '';
    document.getElementById('vnSheetErr').className = 'vn-sheet-err';
    document.getElementById('vnSheetErr').textContent = '';
    document.getElementById('vnSheetSave').disabled = false;
    document.getElementById('vnSheetBackdrop').classList.add('open');
    document.getElementById('vnSheet').classList.add('open');
    setTimeout(function(){ document.getElementById('vnFldCompany').focus(); }, 100);
  }

  function vnOpenEdit(item) {
    _editId = item.id;
    document.getElementById('vnSheetTitle').textContent = 'Edit Vendor';
    document.getElementById('vnEditId').value = item.id;
    document.getElementById('vnFldCompany').value  = item.company     || '';
    document.getElementById('vnFldCategory').value = item.category    || '';
    document.getElementById('vnFldContact').value  = item.contact     || '';
    document.getElementById('vnFldPhone').value    = item.phone       || '';
    document.getElementById('vnFldAddress').value  = item.address     || '';
    document.getElementById('vnFldWebsite').value  = item.website     || '';
    document.getElementById('vnFldAccount').value  = item.account_num || '';
    document.getElementById('vnFldNotes').value    = item.notes       || '';
    document.getElementById('vnSheetErr').className = 'vn-sheet-err';
    document.getElementById('vnSheetErr').textContent = '';
    document.getElementById('vnSheetSave').disabled = false;
    document.getElementById('vnSheetBackdrop').classList.add('open');
    document.getElementById('vnSheet').classList.add('open');
    setTimeout(function(){ document.getElementById('vnFldCompany').focus(); }, 100);
  }

  function vnCloseSheet() {
    document.getElementById('vnSheetBackdrop').classList.remove('open');
    document.getElementById('vnSheet').classList.remove('open');
    _editId = null;
  }

  async function vnSaveItem() {
    var saveBtn = document.getElementById('vnSheetSave');
    if (saveBtn.disabled) return;
    var errDiv = document.getElementById('vnSheetErr');
    errDiv.className = 'vn-sheet-err';
    errDiv.textContent = '';

    var company = document.getElementById('vnFldCompany').value.trim();
    if (!company) {
      errDiv.textContent = 'Company name is required.';
      errDiv.className = 'vn-sheet-err show';
      document.getElementById('vnFldCompany').focus();
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    var isEdit  = !!_editId;
    var payload = {
      action:      isEdit ? 'edit_item' : 'add_item',
      company:     company,
      category:    document.getElementById('vnFldCategory').value.trim(),
      contact:     document.getElementById('vnFldContact').value.trim(),
      phone:       document.getElementById('vnFldPhone').value.trim(),
      address:     document.getElementById('vnFldAddress').value.trim(),
      website:     document.getElementById('vnFldWebsite').value.trim(),
      account_num: document.getElementById('vnFldAccount').value.trim(),
      notes:       document.getElementById('vnFldNotes').value.trim(),
    };
    if (isEdit) {
      payload.id = _editId;
    } else {
      payload.section_id = _activeSec;
    }

    try {
      var r = await fetch('/api/vendors', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
      });
      var d = await r.json();
      if (!d.ok) {
        errDiv.textContent = d.error || 'Save failed.';
        errDiv.className = 'vn-sheet-err show';
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
        return;
      }
      vnCloseSheet();
      await vnLoadData();
    } catch (e) {
      errDiv.textContent = 'Network error. Please try again.';
      errDiv.className = 'vn-sheet-err show';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
    }
  }

  // ---- Add / rename section --------------------------------------------
  function vnOpenAddSection() {
    var name = prompt('New section name:');
    if (!name || !name.trim()) return;
    vnApiAddSection(name.trim());
  }

  function vnOpenRenameSection(secId, currentName) {
    var name = prompt('Rename section:', currentName);
    if (!name || !name.trim() || name.trim() === currentName) return;
    vnApiRenameSection(secId, name.trim());
  }

  async function vnApiAddSection(name) {
    try {
      var r = await fetch('/api/vendors', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'add_section', name: name}),
      });
      var d = await r.json();
      if (!d.ok) { alert(d.error || 'Failed to add section.'); return; }
      if (d.section) _activeSec = d.section.id;
      await vnLoadData();
    } catch (e) {
      alert('Network error.');
    }
  }

  async function vnApiRenameSection(secId, name) {
    try {
      var r = await fetch('/api/vendors', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'edit_section', id: secId, name: name}),
      });
      var d = await r.json();
      if (!d.ok) { alert(d.error || 'Failed to rename section.'); return; }
      await vnLoadData();
    } catch (e) {
      alert('Network error.');
    }
  }

  // ---- Delete confirm --------------------------------------------------
  function vnConfirmDelete(type, id, name) {
    _pendingDel = {type: type, id: id, name: name};
    var title = type === 'section'
      ? 'Delete section?'
      : 'Delete vendor?';
    var msg = type === 'section'
      ? 'Delete "' + name + '" and all its vendors? This cannot be undone.'
      : 'Delete "' + name + '"? This cannot be undone.';
    document.getElementById('vnConfirmTitle').textContent = title;
    document.getElementById('vnConfirmMsg').textContent   = msg;
    document.getElementById('vnConfirmOk').disabled = false;
    document.getElementById('vnConfirmOk').textContent = 'Delete';
    document.getElementById('vnConfirmBackdrop').classList.add('open');
  }

  function vnCloseConfirm() {
    document.getElementById('vnConfirmBackdrop').classList.remove('open');
    _pendingDel = null;
  }

  async function vnDoDelete() {
    if (!_pendingDel) return;
    var okBtn = document.getElementById('vnConfirmOk');
    if (okBtn.disabled) return;
    okBtn.disabled = true;
    okBtn.textContent = 'Deleting…';

    var action = _pendingDel.type === 'section' ? 'delete_section' : 'delete_item';
    try {
      var r = await fetch('/api/vendors', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: action, id: _pendingDel.id}),
      });
      var d = await r.json();
      if (!d.ok) {
        alert(d.error || 'Delete failed.');
        okBtn.disabled = false;
        okBtn.textContent = 'Delete';
        return;
      }
      if (_pendingDel.type === 'section' && _activeSec === _pendingDel.id) {
        _activeSec = null;
      }
      vnCloseConfirm();
      await vnLoadData();
    } catch (e) {
      alert('Network error.');
      okBtn.disabled = false;
      okBtn.textContent = 'Delete';
    }
  }

  // Expose for inline onclick attributes in sheet (save button uses onclick=vnSaveItem)
  window.vnOpenAdd          = vnOpenAdd;
  window.vnOpenEdit         = vnOpenEdit;
  window.vnCloseSheet       = vnCloseSheet;
  window.vnSaveItem         = vnSaveItem;
  window.vnOpenAddSection   = vnOpenAddSection;
  window.vnCloseConfirm     = vnCloseConfirm;
  window.vnConfirmDelete    = vnConfirmDelete;
  window.vnDoDelete         = vnDoDelete;
  window.vnRenderList       = vnRenderList;

})();
</script>
