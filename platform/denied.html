<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Access restricted - Pier Foundations Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#006DB0;
    --accent-dark:#005A91;
    --accent-light:#E0F0FF;
    --text:#2B2F36;
    --text-soft:#5A6472;
    --border:#D9DEE6;
    --bg:#F2F5F9;
    --card:#FFFFFF;
    --warn:#B4232A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text);
    background:linear-gradient(135deg,#E9F1F8 0%,#F2F5F9 60%,#FFFFFF 100%);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .box{
    width:100%;max-width:440px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 12px 40px rgba(0,40,80,0.10);
    padding:36px 32px 30px;
    text-align:center;
  }
  .mark{
    display:inline-flex;align-items:center;justify-content:center;
    width:56px;height:56px;border-radius:14px;
    background:var(--accent);color:#fff;
    font-weight:700;font-size:1.4rem;letter-spacing:0.5px;
    margin-bottom:16px;
  }
  h1{font-size:1.18rem;font-weight:700;margin:0 0 8px;color:var(--text);}
  p{font-size:0.92rem;color:var(--text-soft);margin:0 0 8px;line-height:1.55;}
  .lock{font-size:2.2rem;margin-bottom:6px;color:var(--warn);}
  a.button{
    display:inline-block;margin-top:22px;padding:11px 22px;
    background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;
    font-size:0.95rem;font-weight:600;
  }
  a.button:hover{background:var(--accent-dark);}
  .foot{margin-top:20px;font-size:0.76rem;color:var(--text-soft);line-height:1.5;}
</style>
</head>
<body>
  <div class="box" role="alert">
    <div class="mark">PF</div>
    <div class="lock" aria-hidden="true">&#128274;</div>
    <h1>Access restricted</h1>
    <p>Your account does not have permission to view this page. This area is
       limited to specific roles on the Pier Foundations Platform.</p>
    <p>If you believe you should have access, contact Brad.</p>
    <a class="button" href="/">Back to your dashboard</a>
    <div class="foot">
      Internal operations tool. Authorized users only.
    </div>
  </div>
</body>
</html>
