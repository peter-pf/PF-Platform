<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Set a new password - Pier Foundations Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#006DB0;
    --accent-dark:#005A91;
    --accent-light:#E0F0FF;
    --text:#2B2F36;
    --text-soft:#5A6472;
    --border:#D9DEE6;
    --bg:#F2F5F9;
    --card:#FFFFFF;
    --error:#B4232A;
    --ok:#1E7A46;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text);
    background:linear-gradient(135deg,#E9F1F8 0%,#F2F5F9 60%,#FFFFFF 100%);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .box{
    width:100%;max-width:400px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 12px 40px rgba(0,40,80,0.10);
    padding:36px 32px 30px;
  }
  .brand{text-align:center;margin-bottom:18px;}
  .brand .mark{
    display:inline-flex;align-items:center;justify-content:center;
    width:56px;height:56px;border-radius:14px;
    background:var(--accent);color:#fff;
    font-weight:700;font-size:1.4rem;letter-spacing:0.5px;
    margin-bottom:12px;
  }
  .brand h1{font-size:1.14rem;font-weight:700;margin:0;color:var(--text);}
  .brand p{font-size:0.85rem;color:var(--text-soft);margin:6px 0 0;line-height:1.5;}
  label{
    display:block;font-size:0.8rem;font-weight:600;color:var(--text-soft);
    margin:14px 0 5px;
  }
  input[type=password]{
    width:100%;padding:11px 13px;
    border:1px solid var(--border);border-radius:8px;
    font-size:0.95rem;font-family:inherit;color:var(--text);
    background:#FBFCFE;transition:border-color .15s, box-shadow .15s;
  }
  input:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-light);
  }
  .hint{font-size:0.74rem;color:var(--text-soft);margin-top:6px;}
  button{
    width:100%;margin-top:22px;padding:12px;
    background:var(--accent);color:#fff;border:none;border-radius:8px;
    font-size:0.98rem;font-weight:600;font-family:inherit;cursor:pointer;
    transition:background .15s;
  }
  button:hover{background:var(--accent-dark);}
  button:disabled{opacity:0.6;cursor:default;}
  .msg{
    display:none;margin-top:16px;padding:10px 12px;border-radius:8px;
    font-size:0.86rem;
  }
  .msg.error{display:block;background:#FCEBEC;border:1px solid #F2C4C7;color:var(--error);}
  .msg.ok{display:block;background:#E8F5EE;border:1px solid #BFE3CD;color:var(--ok);}
  .foot{text-align:center;margin-top:20px;font-size:0.76rem;color:var(--text-soft);line-height:1.5;}
</style>
</head>
<body>
  <form class="box" id="resetForm" autocomplete="on">
    <div class="brand">
      <div class="mark">PF</div>
      <h1>Set a new password</h1>
      <p>Your account uses a temporary password. Choose a new one to continue.</p>
    </div>

    <label for="password">New password</label>
    <input type="password" id="password" name="password"
           autocomplete="new-password" required autofocus minlength="12"
           placeholder="At least 12 characters">

    <label for="confirm">Confirm new password</label>
    <input type="password" id="confirm" name="confirm"
           autocomplete="new-password" required minlength="12"
           placeholder="Re-enter your new password">
    <div class="hint">Use at least 12 characters. Avoid reusing an old password.</div>

    <button type="submit" id="submitBtn">Update password</button>

    <div class="msg" id="msgBox" role="alert"></div>

    <div class="foot">
      Internal operations tool. Authorized users only.<br>
      Trouble? Contact Brad.
    </div>
  </form>

<script>
(function () {
  var form = document.getElementById('resetForm');
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msgBox');

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + kind;
  }
  function clearMsg() { msg.textContent = ''; msg.className = 'msg'; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearMsg();
    var pw = document.getElementById('password').value;
    var cf = document.getElementById('confirm').value;
    if (pw.length < 12) { show('Password must be at least 12 characters.', 'error'); return; }
    if (pw !== cf) { show('Passwords do not match.', 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Updating…';

    fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ password: pw, confirm: cf })
    })
    .then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, data: data }; });
    })
    .then(function (r) {
      if (r.ok && r.data.status === 'ok') {
        show('Password updated. Redirecting…', 'ok');
        window.location.href = (r.data.redirect && r.data.redirect.charAt(0) === '/')
          ? r.data.redirect : '/';
      } else if (r.data && /session has expired/i.test(r.data.message || '')) {
        window.location.href = '/login.html';
      } else {
        show((r.data && r.data.message) || 'Could not update password.', 'error');
        btn.disabled = false;
        btn.textContent = 'Update password';
      }
    })
    .catch(function () {
      show('Could not reach the server. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Update password';
    });
  });
})();
</script>
</body>
</html>
